<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<meta name="description" content="슈가 발레 카페의 다섯 정령에게 다음 연습을 위한 마법 포션을 주문해요.">
<title>정령 포션 주문대 · 슈가의 발레왕국</title>
<link rel="stylesheet" href="../style.css?v=20261121f">
<link rel="stylesheet" href="../court.css?v=20261121f">
</head>
<body class="court shop">
<div class="court-shell">
  <header class="courtbar">
    <a class="return" href="../?v=20261121f"><span aria-hidden="true">←</span> 왕국으로</a>
    <div class="purse" aria-label="왕국 지갑"><span class="coin-unit"><i aria-hidden="true"></i>코인 <b data-coin>0</b></span><span class="life-unit"><i aria-hidden="true"></i>생명력 <b data-life>0</b></span></div>
  </header>
  <main class="shop-main">
    <div class="shop-heading"><p class="place-label">슈가 발레 카페</p><h1>정령 포션 주문대</h1></div>
    <div class="shop-layout">
      <div class="shop-window" id="shopWindow">
        <img class="window-bg" src="../assets/potion-room.webp" alt="">
        <img class="staff-figure" id="staffFigure" src="../../kingdom/assets/etu_hero.webp" alt="에튜">
        <div class="counter-ledge"></div><img class="flask" src="../assets/practice-flask.webp" alt="">
        <i class="life-flight" aria-hidden="true"></i>
        <div class="window-caption"><b id="figureName">에튜</b><span id="figureRole">균형의 정령</span></div>
      </div>
      <div class="order-panel">
        <h2 class="select-title">누구에게 주문할까요?</h2>
        <div class="roster" id="shopRoster" role="group" aria-label="포션 담당 정령"></div>
        <section class="recipe" aria-labelledby="potionTitle">
          <div class="recipe-title"><h2 id="potionTitle"></h2><span id="brewLevel"></span></div>
          <p class="staff-line" id="staffLine"></p>
          <div class="effect-row"><span>연습 수료 효과</span><b id="effect"></b></div>
          <div class="brew-progress"><b id="progressName"></b><span id="orderCount"></span></div>
          <div class="brew-track" aria-hidden="true"><i id="orderBar"></i></div>
          <p id="growthNote" class="growth-note"></p>
          <button class="action" id="orderButton" type="button">포션 주문</button>
          <p class="order-note" id="orderNote"></p>
        </section>
        <p id="orderStatus" class="order-status" role="status" aria-live="polite"></p>
        <a class="action" id="shopPractice" href="../studio/?v=20261121f#first-bar" hidden>연습하러 가기 <span aria-hidden="true">→</span></a>
        <div class="shop-links"><a href="../../cafe/?v=20261121f">카페 영업 돕기 →</a><a href="../studio/?v=20261121f">연습실 둘러보기 →</a></div>
      </div>
    </div>
  </main>
  <footer class="court-foot">© 슈가의 발레왕국</footer>
</div>
<script src="../assets/town.js?v=20261121f"></script>
<script src="shop.js?v=20261121f"></script>
</body>
</html>
