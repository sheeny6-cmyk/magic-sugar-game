<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7ef">
<meta name="description" content="연습복을 입은 슈가와 발레 용어 빈칸 세 개를 채워요. 마지막 정답과 함께 코인이 쌓이고 첫 수업 선물이 열려요.">
<title>왕립 발레 스튜디오 · 슈가의 발레왕국</title>
<link rel="stylesheet" href="../style.css?v=20261121d">
<link rel="stylesheet" href="studio.css?v=20261121d">
</head>
<body class="sub studio">
<main class="app">
  <header class="subbar"><a class="back" href="../?v=20261121d" aria-label="왕국으로">←</a><h1 class="title">왕립 발레 스튜디오</h1><span class="coin"><span aria-hidden="true">🪙</span><b data-coin>0</b></span></header>
  <button class="resume-lesson" id="resumeLesson" type="button" hidden></button>
  <section class="attend" aria-label="오늘의 연습복">
    <img class="attend-sugar" data-worn-pose="ready" src="../assets/dancers/basic-ready.webp" alt="">
    <div class="attend-txt"><p>오늘의 연습복</p><h2 data-worn-name>기본 핑크 레오타드</h2><a href="../dressroom/?v=20261121d">갈아입기 →</a></div>
  </section>
  <section class="course-board" aria-labelledby="classList"><h2 id="classList">오늘의 연습</h2><p id="courseNote">수업은 모두 무료예요. 빈칸 세 개를 맞히면 코인이 자동으로 들어와요.</p><div class="classes" id="classes"></div></section>
  <a class="practice-kit" href="../potions/?v=20261121d"><span id="practiceKit">정령에게 연습 포션 주문하기</span><span aria-hidden="true">→</span></a>
  <section class="lv"><div class="level-line"><b id="lvName"></b><span id="lvClasses"></span></div><div class="lv-bar"><i id="lvBar"></i></div><p id="lvNote"></p><div id="stamps"></div><a id="stageLink" href="../stage/?v=20261121d"></a></section>
  <footer class="foot">© 신정화 · 캐릭터 IP 「슈가」</footer>

  <dialog class="sheet" id="confirm" aria-labelledby="cName">
    <div class="sheet-card">
      <p id="cKicker" class="muted">무료 수업 · 빈칸 3개</p><h2 id="cName"></h2><p id="cDesc"></p>
      <div class="c-fee"><span>완주하면</span><b id="cReward"></b></div><p id="cNote"></p>
      <div class="c-btns"><button type="button" class="btn ghost" id="cCancel">닫기</button><button type="button" class="btn primary" id="cGo">연습 시작</button></div>
    </div>
  </dialog>

  <dialog class="lesson" id="lesson" aria-labelledby="lTitle">
    <div class="lcard">
      <div class="lesson-heading"><div><p id="lCount"></p><h2 id="lTitle"></h2></div><button type="button" id="lPause" aria-label="수업 저장하고 잠시 나가기">잠시 나가기</button></div>
      <div class="lesson-progress" id="lDots" aria-hidden="true"><i></i><i></i><i></i></div>
      <figure class="practice-scene" id="lScene">
        <img class="practice-dancer" id="lDancer" alt="">
        <figcaption><span id="lPose"></span><span id="lPrize"></span></figcaption>
      </figure>
      <div class="cue-card"><div class="teacher"><img id="lPortrait" alt=""><span id="lTeacher"></span></div><p id="lCue" tabindex="-1"></p></div>
      <div class="choice-title"><b id="lInstruction">빈칸에 들어갈 말은?</b><button type="button" id="lHint">힌트 보기</button></div>
      <div id="lChoices" class="lesson-choices" role="group" aria-labelledby="lInstruction"></div>
      <p id="lFeedback" class="lesson-feedback" role="status" aria-live="polite"></p>
      <button type="button" class="btn primary block" id="lNext" hidden>다음 문제</button>
    </div>
  </dialog>

  <dialog class="result" id="result" aria-labelledby="rTitle">
    <div class="rcard">
      <p class="r-course" id="rCourse"></p><h2 id="rTitle"></h2><p class="wallet-line" id="rBalance"></p>
      <p class="bonus-line" id="rCoinsDetail" hidden></p>
      <div class="reward-feature">
        <div class="reward-figure"><img id="rDancer" alt=""></div>
        <div class="reward-text"><p class="feature-label" id="rMilestone"></p><h3 id="rGoalName"></h3><p id="rGoalNote"></p>
          <div class="goal-track" id="rTrack" hidden><i id="rTrackFill"></i></div>
          <button type="button" id="rWear" class="btn primary" hidden>선물 바로 입기</button>
          <a class="btn ghost" id="rGoalLink" hidden></a>
        </div>
      </div>
      <p class="last-answer" id="rLast"></p>
      <details id="rDetails"><summary>정답과 연습 기록</summary><p id="rTerms"></p><p id="rRecord"></p><p id="rGains"></p><p id="rPotion" hidden></p><p id="rRefund" hidden></p></details>
      <div class="r-btns"><button type="button" class="btn primary" id="rAgain">한 번 더 연습</button><a class="btn ghost" href="../?v=20261121d">왕국으로</a></div>
      <div class="r-links"><a href="../potions/?v=20261121d">정령 포션 주문</a><a id="rStage" href="../stage/?v=20261121d" hidden>왕립 극장 가기</a></div>
      <p class="sr-only" id="rAnnounce" role="status" aria-live="polite"></p>
    </div>
  </dialog>
</main>
<script src="../assets/town.js?v=20261121d"></script><script src="lessons.js?v=20261121d"></script><script src="studio.js?v=20261121d"></script>
</body>
</html>
