<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7ef">
<meta name="description" content="슈가와 함께 3/4 왈츠 박자를 타는 왕립 발레 스튜디오. 박자·파드샤·그랑제떼를 눌러 노래를 완주하면 코인과 도장이 쌓여요.">
<title>왕립 발레 스튜디오 · 슈가의 발레왕국</title>
<link rel="stylesheet" href="../style.css?v=20261121f">
<link rel="stylesheet" href="studio.css?v=20261121f">
</head>
<body class="sub studio">
<main class="app">
  <header class="subbar"><a class="back" href="../?v=20261121f" aria-label="왕국으로">←</a><h1 class="title">왕립 발레 스튜디오</h1><span class="coin"><span aria-hidden="true">🪙</span><b data-coin>0</b></span></header>
  <button class="resume-lesson" id="resumeLesson" type="button" hidden></button>
  <section class="attend" aria-label="오늘의 연습복">
    <img class="attend-sugar" data-worn-pose="ready" src="../assets/dancers/basic-ready.webp" alt="">
    <div class="attend-txt"><p>오늘의 연습복</p><h2 data-worn-name>기본 핑크 레오타드</h2><a href="../dressroom/?v=20261121f">갈아입기 →</a></div>
  </section>
  <section class="course-board" aria-labelledby="classList"><h2 id="classList">오늘의 연습</h2><p id="courseNote">수업은 모두 무료예요. 음악이 끝날 때까지 박자를 타면 코인이 쌓여요.</p><div class="classes" id="classes"></div></section>
  <a class="practice-kit" href="../potions/?v=20261121f"><span id="practiceKit">정령에게 연습 포션 주문하기</span><span aria-hidden="true">→</span></a>
  <section class="lv"><div class="level-line"><b id="lvName"></b><span id="lvClasses"></span></div><div class="lv-bar"><i id="lvBar"></i></div><p id="lvNote"></p><div id="stamps"></div><a id="stageLink" href="../stage/?v=20261121f"></a></section>
  <footer class="foot">© 슈가의 발레왕국</footer>

  <dialog class="sheet" id="confirm" aria-labelledby="cName">
    <div class="sheet-card">
      <p id="cKicker" class="muted">무료 수업 · 8노트</p><h2 id="cName"></h2><p id="cDesc"></p>
      <div class="c-fee"><span>완주하면</span><b id="cReward"></b></div><p id="cNote"></p>
      <div class="c-btns"><button type="button" class="btn ghost" id="cCancel">닫기</button><button type="button" class="btn primary" id="cGo">연습 시작</button></div>
    </div>
  </dialog>

  <dialog class="lesson" id="lesson" aria-labelledby="lTitle">
    <div class="lcard">
      <div class="lesson-heading">
        <div><p id="lCount">노트 0 / 8</p><h2 id="lTitle">바 워크</h2></div>
        <div class="l-tools"><button type="button" id="lSound" aria-pressed="true">🔊 소리</button><button type="button" id="lPause">잠시 나가기</button></div>
      </div>
      <div class="lesson-progress" id="lDots" aria-hidden="true"></div>
      <figure class="practice-scene" id="lScene">
        <img class="practice-dancer" id="lDancer" alt="">
        <figcaption><span id="lPose">준비 자세</span><span id="lPrize"></span></figcaption>
        <div class="combo-badge" id="lCombo" hidden><b>0</b><span>COMBO</span></div>
        <p class="judge-flash" id="lJudge" aria-hidden="true"></p>
        <div class="spark-layer" id="lSparks" aria-hidden="true"></div>
      </figure>
      <div class="rhythm-track" id="track" role="button" tabindex="-1" aria-label="박자 트랙 · 누르면 박자를 탁!">
        <div class="note-lane" id="lane"></div>
        <div class="target-zone" id="target"><span class="ring"></span><span class="target-mark">🩰</span></div>
      </div>
      <div class="rhythm-pad" id="pad" role="group" aria-label="발레 동작 버튼">
        <button class="move beat" data-move="beat" type="button"><span aria-hidden="true">🩰</span>박자<small>Space</small></button>
        <button class="move cat" data-move="cat" type="button"><span aria-hidden="true">🐾</span>파드샤<small>2</small></button>
        <button class="move jump" data-move="jump" type="button"><span aria-hidden="true">🦋</span>그랑제떼<small>3</small></button>
      </div>
      <p class="buff-badge" id="lBuff" hidden></p>
      <p class="reaction" id="lReaction"><img id="lPortrait" alt=""><span id="lTeacher"></span><b id="lFeedback" role="status" aria-live="polite"></b></p>
    </div>
  </dialog>

  <dialog class="result" id="result" aria-labelledby="rTitle">
    <div class="rcard">
      <p class="r-course" id="rCourse"></p><h2 id="rTitle"></h2><p class="wallet-line" id="rBalance"></p>
      <p class="bonus-line" id="rCoinsDetail" hidden></p>
      <div class="score-row" id="rScore" role="group" aria-label="판정 결과">
        <div class="perfect"><span>Perfect</span><b id="rPerfect">0</b></div>
        <div class="good"><span>Good</span><b id="rGood">0</b></div>
        <div class="miss"><span>Miss</span><b id="rMiss">0</b></div>
        <div class="combo"><span>Max Combo</span><b id="rCombo">0</b></div>
      </div>
      <div class="reward-feature">
        <div class="reward-figure"><img id="rDancer" alt=""></div>
        <div class="reward-text"><p class="feature-label" id="rMilestone"></p><h3 id="rGoalName"></h3><p id="rGoalNote"></p>
          <div class="goal-track" id="rTrack" hidden><i id="rTrackFill"></i></div>
          <button type="button" id="rWear" class="btn primary" hidden>선물 바로 입기</button>
          <a class="btn ghost" id="rGoalLink" hidden></a>
        </div>
      </div>
      <details id="rDetails"><summary>연습 기록</summary><p id="rRecord"></p><p id="rGains"></p><p id="rStamp"></p><p id="rPotion" hidden></p><p id="rRefund" hidden></p></details>
      <div class="r-btns"><button type="button" class="btn primary" id="rAgain">한 번 더!</button><a class="btn ghost" href="../potions/?v=20261121f">정령 포션 주문대</a></div>
      <div class="r-links"><a id="rStage" href="../stage/?v=20261121f">왕립 극장</a><a href="../?v=20261121f">왕국으로</a></div>
      <p class="sr-only" id="rAnnounce" role="status" aria-live="polite"></p>
    </div>
  </dialog>
</main>
<script src="../assets/town.js?v=20261121f"></script><script src="lessons.js?v=20261121f"></script><script src="studio.js?v=20261121f"></script>
</body>
</html>
