<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7ef">
<meta name="description" content="다섯 벌의 발레 의상을 입혀 보고, 마음에 드는 차림으로 연습실과 무대에 올라요.">
<title>왕궁 드레스룸 · 슈가의 발레왕국</title>
<link rel="stylesheet" href="../style.css?v=20261121i">
<link rel="stylesheet" href="dress.css?v=20261121i">
</head>
<body class="sub dress"><main class="app">
  <header class="subbar"><a class="back" href="../?v=20261121i" aria-label="왕국으로">←</a><h1 class="title">왕궁 드레스룸</h1><span class="coin"><span aria-hidden="true">🪙</span><b data-coin>0</b></span></header>
  <section class="fitting" id="fitting" aria-labelledby="lookName">
    <div class="mirror">
      <span class="look-status" id="lookStatus">착용 중</span>
      <img id="lookDancer" src="../assets/dancers/basic-ready.webp" alt="기본 핑크 레오타드를 입은 슈가 공주">
    </div>
    <div class="outfit-info">
      <h2 id="lookName">기본 핑크 레오타드</h2>
      <p id="lookDesc"></p><p class="outfit-cost" id="lookCost"></p>
      <button id="lookAction" class="btn primary" type="button" hidden></button>
      <a class="btn ghost" id="lookGo" href="../studio/?v=20261121i#first-bar">이 옷 입고 연습하기</a>
    </div>
  </section>
  <section class="wardrobe" aria-labelledby="clothesTitle">
    <div class="own-line"><h2 id="clothesTitle">의상 골라 입기</h2><span id="ownCount"></span></div>
    <p class="preview-help" id="previewHelp">의상을 누르면 먼저 입어 보여줘요.</p>
    <div class="shop-grid" id="shop" role="group" aria-label="의상 선택"></div>
  </section>
  <p id="lookMessage" role="status" aria-live="polite"></p>
  <footer class="foot">© 슈가의 발레왕국</footer>
</main>
<script src="../assets/town.js?v=20261121i"></script>
<script src="dress.js?v=20261121i"></script>
</body>
</html>
