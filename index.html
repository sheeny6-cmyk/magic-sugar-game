<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#241033" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>마법 슈가 · 발레 리듬 톡톡</title>
<style>
:root{
  --pink:#ffd0e6;
  --pink-deep:#ff9ecb;
  --aqua:#a9e9f6;
  --lav:#c8b0f2;
  --gold:#f6dfb0;
  --ink:#3b1740;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;height:100%;
  background:#12071c;color:#fff;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;touch-action:none;
}
#app{
  position:relative;width:100%;max-width:480px;height:100dvh;
  margin:0 auto;overflow:hidden;isolation:isolate;background:#1b1029;
  box-shadow:0 0 90px rgba(180,120,220,.20);
}
@supports (height:100dvh){#app{height:100dvh;}}
@supports not (height:100dvh){#app{height:100vh;}}
canvas#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.hidden{display:none !important;}

/* ---------------- HUD ---------------- */
.hud{
  position:absolute;left:0;right:0;top:0;z-index:6;pointer-events:none;
  padding:calc(var(--safe-t) + 10px) 12px 0;
  font-variant-numeric:tabular-nums;
}
.hud-row{display:flex;align-items:center;gap:8px;}
.pill{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;font-size:11px;letter-spacing:.02em;
  background:rgba(44,18,58,.40);border:1px solid rgba(255,225,246,.20);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  color:#ffe9f7;white-space:nowrap;max-width:60vw;overflow:hidden;
}
.pill .dot{width:5px;height:5px;border-radius:50%;background:var(--pink-deep);box-shadow:0 0 8px var(--pink-deep);flex:none;}
.pill b{font-weight:800;font-size:10.5px;letter-spacing:.10em;color:#ffd8ee;}
.pill span{opacity:.85;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.score{
  font-size:17px;font-weight:800;letter-spacing:.01em;color:#fff6fd;
  text-shadow:0 2px 10px rgba(255,120,190,.55),0 1px 2px rgba(30,6,30,.7);
}
.icon-btn{
  pointer-events:auto;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,225,246,.22);
  background:rgba(44,18,58,.42);color:#fff;font-size:14px;display:grid;place-items:center;
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);cursor:pointer;
}
.bar{
  position:relative;margin-top:9px;height:5px;border-radius:999px;
  background:rgba(255,255,255,.13);overflow:visible;
}
.bar i{
  position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#ffb8de,#ffd9a8,#b8ecff);
  box-shadow:0 0 10px rgba(255,190,230,.65);
}
.bar .bar-star{
  position:absolute;top:50%;left:0;transform:translate(-50%,-50%);
  font-size:10px;color:#fff4c8;text-shadow:0 0 10px #ffd48a,0 0 18px #ff9ad0;
}

/* ---------------- judgment / combo ---------------- */
.judge{
  position:absolute;left:50%;top:15.5%;transform:translate(-50%,-50%) scale(.8);
  z-index:7;pointer-events:none;opacity:0;
  font-size:30px;font-weight:900;letter-spacing:.06em;white-space:nowrap;
  color:#fff;text-shadow:0 0 18px rgba(255,170,220,.9),0 3px 10px rgba(40,6,30,.6);
}
.judge.on{animation:judgePop .72s cubic-bezier(.2,.9,.3,1) forwards;}
.judge.perfect{color:#fff3c4;text-shadow:0 0 22px rgba(255,214,120,.95),0 0 40px rgba(255,160,220,.7);}
.judge.good{color:#d9f5ff;text-shadow:0 0 20px rgba(150,230,255,.9);}
.judge.nice{color:#ffd6ec;text-shadow:0 0 18px rgba(255,160,220,.85);}
.judge.miss{color:#b9a6c9;font-size:22px;text-shadow:none;opacity:.9;}
.judge.count{font-size:64px;color:#fff2f9;text-shadow:0 0 30px rgba(255,160,215,.9);}
.judge.bonus{font-size:20px;color:#ffe9a8;letter-spacing:.02em;}
@keyframes judgePop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.72);}
  18%{opacity:1;transform:translate(-50%,-50%) scale(1.10);}
  38%{transform:translate(-50%,-50%) scale(1);}
  72%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-128%) scale(1.02);}
}
.combo{
  position:absolute;left:50%;top:23%;transform:translate(-50%,-50%);
  z-index:7;pointer-events:none;text-align:center;opacity:0;transition:opacity .3s ease;
}
.combo.on{opacity:1;}
.combo b{display:block;font-size:34px;line-height:1;font-weight:900;font-style:italic;
  color:#fff;text-shadow:0 0 20px rgba(255,150,210,.85),0 2px 6px rgba(40,4,30,.6);}
.combo span{display:block;margin-top:3px;font-size:10px;font-weight:800;letter-spacing:.24em;color:#ffd7ee;opacity:.9;}
.combo.bump b{animation:comboBump .28s cubic-bezier(.2,1.4,.4,1);}
@keyframes comboBump{0%{transform:scale(1.28);}100%{transform:scale(1);}}

/* ---------------- screens ---------------- */
.screen{
  position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:calc(var(--safe-t) + 22px) 22px calc(var(--safe-b) + 22px);
  background:linear-gradient(180deg,rgba(24,11,36,.66) 0%,rgba(16,7,26,.86) 62%,rgba(12,5,20,.93) 100%);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.title-top{text-align:center;display:flex;flex-direction:column;align-items:center;}
.crest{
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-size:20px;color:#fff3fa;margin-bottom:14px;
  background:radial-gradient(circle at 40% 30%,rgba(255,214,240,.34),rgba(180,110,200,.10) 62%,transparent 72%);
  border:1px solid rgba(255,225,246,.28);
  box-shadow:0 0 34px rgba(255,150,210,.45),inset 0 0 18px rgba(255,220,250,.25);
}
h1.logo{
  margin:0;font-size:40px;letter-spacing:-.01em;font-weight:900;
  background:linear-gradient(180deg,#fff8fd 0%,#ffd7ee 52%,#f5c6e6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,140,200,.5));
}
.logo-sub{
  margin:8px 0 0;font-size:11px;font-weight:800;letter-spacing:.34em;color:#f3cfe8;opacity:.9;
}
.tagline{margin:16px 0 0;font-size:13.5px;line-height:1.7;color:#f6dcf1;opacity:.92;text-align:center;}
.title-bottom{width:100%;max-width:330px;margin-top:30px;display:flex;flex-direction:column;gap:10px;}
.btn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;border:0;border-radius:999px;padding:16px 20px;cursor:pointer;
  font-family:inherit;font-size:17px;font-weight:800;letter-spacing:.01em;
  transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:scale(.975);}
.btn.primary{
  color:#4d0f38;
  background:linear-gradient(180deg,#ffe3f3 0%,#ffb7dd 46%,#ff96c9 100%);
  box-shadow:0 12px 28px rgba(255,120,190,.36),inset 0 1px 0 rgba(255,255,255,.75);
}
.btn.primary em{font-style:normal;font-size:10.5px;letter-spacing:.14em;opacity:.62;font-weight:800;}
.btn.ghost{
  color:#ffe9f7;background:rgba(255,255,255,.075);
  border:1px solid rgba(255,220,245,.26);font-size:14px;padding:13px 18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
}
.btn.ghost small{font-size:11px;opacity:.72;font-weight:700;letter-spacing:.02em;}
.legend{
  display:flex;justify-content:center;gap:14px;flex-wrap:wrap;
  margin-top:16px;font-size:11px;color:#e8cfe6;opacity:.72;
}
.legend i{font-style:normal;color:#ffd9a8;font-weight:800;}
.fine{margin:14px 0 0;font-size:10px;color:#c9aecb;opacity:.62;text-align:center;line-height:1.6;}

/* result */
.rp{
  width:100%;max-width:340px;border-radius:26px;padding:24px 20px 20px;text-align:center;
  background:linear-gradient(180deg,rgba(70,30,74,.62),rgba(34,14,44,.74));
  border:1px solid rgba(255,220,245,.18);
  box-shadow:0 24px 60px rgba(10,2,20,.55),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.kicker{margin:0;font-size:10.5px;font-weight:800;letter-spacing:.28em;color:#ffc7e6;opacity:.85;}
.rtitle{margin:8px 0 0;font-size:30px;font-weight:900;color:#fff6fd;
  text-shadow:0 0 26px rgba(255,150,210,.55);}
.rstars{margin:14px 0 2px;font-size:30px;letter-spacing:.14em;color:#ffe6a8;
  text-shadow:0 0 22px rgba(255,200,110,.7);}
.rstars .off{color:rgba(255,230,180,.20);text-shadow:none;}
.rscore{margin:10px 0 0;font-size:15px;color:#ffe9f7;opacity:.9;}
.rscore b{font-size:30px;font-weight:900;color:#fff;letter-spacing:.01em;
  text-shadow:0 0 22px rgba(255,170,225,.6);}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px;}
.rcell{
  border-radius:14px;padding:9px 8px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,225,246,.10);
}
.rcell span{display:block;font-size:9.5px;letter-spacing:.14em;font-weight:800;color:#e6c9e4;opacity:.72;}
.rcell b{display:block;margin-top:3px;font-size:16px;font-weight:800;color:#fff4fb;}
.rcell.p b{color:#ffe9a8;} .rcell.g b{color:#cdf3ff;} .rcell.n b{color:#ffd0ea;} .rcell.m b{color:#c1aecf;}
.newrec{display:inline-block;margin-top:10px;padding:4px 11px;border-radius:999px;
  font-size:9.5px;font-weight:800;letter-spacing:.16em;color:#4d0f38;
  background:linear-gradient(180deg,#ffe9b8,#ffc978);}
.rbtns{display:flex;gap:9px;margin-top:18px;}
.rbtns .btn{padding:15px 12px;font-size:15px;}

/* toast */
.toast{
  position:absolute;left:50%;bottom:calc(var(--safe-b) + 26px);transform:translate(-50%,14px);
  z-index:9;pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;
  padding:10px 16px;border-radius:999px;font-size:12px;font-weight:700;
  background:rgba(38,14,48,.78);border:1px solid rgba(255,220,245,.22);
  color:#ffe9f7;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.toast.on{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" aria-label="마법 슈가 발레 무대"></canvas>

  <!-- HUD -->
  <div id="hud" class="hud hidden">
    <div class="hud-row">
      <div class="pill"><span class="dot"></span><b id="hudAct">1막</b><span id="hudSong">달빛 왈츠</span></div>
      <div class="hud-right">
        <div class="score" id="hudScore">0</div>
        <button class="icon-btn" id="btnMute" aria-label="소리 켜기/끄기">🔊</button>
      </div>
    </div>
    <div class="bar"><i id="hudProg"></i><span class="bar-star" id="hudStar">✦</span></div>
  </div>

  <div id="judge" class="judge"></div>
  <div id="combo" class="combo"><b id="comboNum">0</b><span>COMBO</span></div>
  <div id="toast" class="toast"></div>

  <!-- 타이틀 -->
  <div id="screenTitle" class="screen">
    <div class="title-top">
      <div class="crest">✦</div>
      <h1 class="logo">마법 슈가</h1>
      <p class="logo-sub">BALLET RHYTHM TAP</p>
      <p class="tagline">달빛 무대 위, 별빛이 링에 닿는 순간<br/>화면 아무 곳이나 톡! 슈가가 춤춰요</p>
    </div>
    <div class="title-bottom">
      <button class="btn primary" id="btnStart"><span>춤추러 가기</span><em>1막 · 달빛 왈츠</em></button>
      <button class="btn ghost" id="btnAct2">2막 · 설탕 요정의 노래 <small id="best2"></small></button>
      <div class="legend">
        <span><i>톡</i> 화면 어디든</span>
        <span><i>Space</i> 키보드</span>
        <span><i>♪</i> 별빛이 링에 닿을 때</span>
      </div>
      <p class="fine">한 곡을 끝까지 즐기는 리듬 게임 · 점수와 별점으로 기록돼요<br/>프로토타입 · 실제 서비스에서는 Apps in Toss로 열립니다</p>
    </div>
  </div>

  <!-- 결과 -->
  <div id="screenResult" class="screen hidden">
    <div class="rp">
      <p class="kicker" id="resKicker">1막 · 달빛 왈츠</p>
      <h2 class="rtitle" id="resTitle">피날레!</h2>
      <div class="rstars" id="resStars">★★★</div>
      <p class="rscore">SCORE <b id="resScore">0</b></p>
      <div id="resNew" class="newrec hidden">NEW RECORD</div>
      <div class="rgrid">
        <div class="rcell"><span>최대 콤보</span><b id="resCombo">0</b></div>
        <div class="rcell"><span>정확도</span><b id="resAcc">0%</b></div>
        <div class="rcell p"><span>PERFECT</span><b id="resP">0</b></div>
        <div class="rcell g"><span>GOOD</span><b id="resG">0</b></div>
        <div class="rcell n"><span>NICE</span><b id="resN">0</b></div>
        <div class="rcell m"><span>MISS</span><b id="resM">0</b></div>
      </div>
      <div class="rbtns">
        <button class="btn ghost" id="btnRetry">다시 추기</button>
        <button class="btn primary" id="btnNext">다음 곡</button>
      </div>
      <button class="btn ghost" id="btnHome" style="margin-top:9px;">무대 고르기</button>
    </div>
  </div>
</div>

const BASE = {C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function midiOf(name){
  const m = /^([A-G])(#|b)?(-?\d+)$/.exec(name);
  let v = BASE[m[1]] + (m[2]==='#'?1:m[2]==='b'?-1:0) + (parseInt(m[3],10)+1)*12;
  return v;
}

const POSE_SEQ = ['b','a','c','b','cast_a','c','a','b','c','cast_b'];

function buildStage(def){
  const beat = def.beat, meter = def.meter, barDur = beat*meter;
  const lead = def.introBars*barDur;
  const events = [], chart = [];
  let bar = 0;

  /* intro swell */
  const introCh = CHORD[def.prog[0]];
  for(let b=0;b<def.introBars;b++){
    const bt = b*barDur;
    introCh.forEach((n,i)=>{
      events.push({at:bt + i*beat*0.5, kind:'mel', m:midiOf(n)+12, dur:1.5, g:0.045});
    });
    events.push({at:bt, kind:'shk', g:0.014});
  }

  def.order.forEach(pName=>{
    def.phrases[pName].forEach((barNotes, bi)=>{
      const ch = CHORD[def.prog[bi % def.prog.length]];
      const bt = lead + bar*barDur;

      events.push({at:bt, kind:'bass', m:midiOf(ch[0])-12, dur:barDur*0.72, g:0.10});

      if(def.arp){
        for(let k=0;k<meter*2;k++){
          events.push({
            at:bt + k*beat*0.5, kind:'mel',
            m:midiOf(ch[k % ch.length]) + 12,
            dur:0.55, g:(k%2?0.028:0.045)
          });
        }
        events.push({at:bt, kind:'shk', g:0.018});
        events.push({at:bt+beat*2, kind:'shk', g:0.012});
      }else{
        for(let b=1;b<meter;b++){
          ch.forEach(n=>{
            events.push({at:bt + b*beat, kind:'mel', m:midiOf(n)+12, dur:0.5, g:0.032});
          });
          events.push({at:bt + b*beat, kind:'shk', g:0.014});
        }
      }

      barNotes.forEach(([b,dur,name])=>{
        const t = bt + b*beat;
        const m = midiOf(name);
        events.push({at:t, kind:'mel', m, dur:Math.max(0.8, dur*beat*1.8), g:0.125});
        const ci = chart.length;
        chart.push({
          t, m, ang:(ci*2.39996)%TAU,
          strong:(b===0),
          spin:(b===0 && bar%4===0),
          pose:POSE_SEQ[ci % POSE_SEQ.length],
          done:false, out:0
        });
      });
      bar++;
    });
  });

  events.sort((a,b)=>a.at-b.at);
  return { events, chart, lead, dur: lead + bar*barDur + 0.7 };
}

/* ============================================================
   audio
   ============================================================ */
const AU = {
  ctx:null, bus:null, mute:false, ready:false,
  init(){
    if(this.ctx){
      if(this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const c = new AC();
    this.ctx = c;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12;
    comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.24;
    const master = c.createGain();
    master.gain.value = this.mute?0:0.9;
    master.connect(comp); comp.connect(c.destination);
    /* small feedback room */
    const dl = c.createDelay(0.6); dl.delayTime.value = 0.16;
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 2400;
    const fb = c.createGain(); fb.gain.value = 0.26;
    const wet = c.createGain(); wet.gain.value = 0.30;
    master.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl);
    lp.connect(wet); wet.connect(comp);
    this.bus = master;
    const nb = c.createBuffer(1, Math.floor(c.sampleRate*0.3), c.sampleRate);
    const nd = nb.getChannelData(0);
    for(let i=0;i<nd.length;i++) nd[i] = (Math.random()*2-1)*Math.pow(1-i/nd.length, 3.2);
    this.nb = nb;
    if(c.state==='suspended') c.resume().catch(()=>{});
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume().catch(()=>{}); },
  setMute(m){
    this.mute = m;
    if(!this.ctx) return;
    const g = this.bus.gain, now = this.ctx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(m?0:0.9, now+0.18);
  },
  bell(t, m, dur, gain, bright){
    const c = this.ctx; if(!c) return;
    if(t < c.currentTime - 0.03) return;
    const f = freqOf(m);
    const out = c.createGain();
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(gain, t+0.008);
    out.gain.exponentialRampToValueAtTime(Math.max(gain*0.0009, 1e-5), t+dur);
    out.connect(this.bus);
    const parts = [[1,1,1],[2,0.30,0.8],[3,0.13,0.62],[4.98,0.055,0.42],[7.1,0.02,0.28]];
    const br = bright==null?1:bright;
    for(let i=0;i<parts.length;i++){
      const mul = parts[i][0], amp = parts[i][1], dm = parts[i][2];
      const o = c.createOscillator(); o.type='sine'; o.frequency.value = f*mul;
      const g = c.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(amp*gain*dm*br, t+0.006);
      g.gain.exponentialRampToValueAtTime(1e-5, t + Math.max(0.18, dur*(0.55+0.45*dm)));
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t+dur+0.06);
    }
  },
  bass(t, m, dur, gain){
    const c = this.ctx; if(!c) return;
    if(t < c.currentTime - 0.03) return;
    const f = freqOf(m);
    const out = c.createGain();
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(gain, t+0.02);
    out.gain.exponentialRampToValueAtTime(gain*0.02, t+dur);
    const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 900;
    out.connect(lp); lp.connect(this.bus);
    [[1,1],[2,0.28],[3,0.10]].forEach(([mul,amp])=>{
      const o = c.createOscillator(); o.type='sine'; o.frequency.value = f*mul;
      const g = c.createGain(); g.gain.value = amp;
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t+dur+0.05);
    });
  },
  shk(t, gain){
    const c = this.ctx; if(!c) return;
    if(t < c.currentTime - 0.03) return;
    const s = c.createBufferSource(); s.buffer = this.nb;
    const bp = c.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value = 5200; bp.Q.value = 0.9;
    const g = c.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(1e-4, t+0.09);
    s.connect(bp); bp.connect(g); g.connect(this.bus);
    s.start(t); s.stop(t+0.12);
  },
  tap(m){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + 0.005;
    this.bell(t, m+12, 0.55, 0.115, 1.25);
  },
  tiny(){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + 0.005;
    this.bell(t, 88, 0.16, 0.028, 0.7);
  },
  finale(){
    if(!this.ctx) return;
    const t = this.ctx.currentTime + 0.02;
    [72,76,79,84].forEach((m,i)=> this.bell(t + i*0.07, m, 2.2, 0.10, 1.1));
  }
};

/* ============================================================
   layout / backdrop
   ============================================================ */
const R = { W:390, H:844, dpr:1, cx:195, floorY:654, ringA:172, ringB:72,
            dancerH:371, dancerFeet:664, palette:'A' };
let BG = null, VIG = null;

function layout(){
  const W = app.clientWidth || window.innerWidth;
  const H = app.clientHeight || window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio||1, 2.5);
  R.W = W; R.H = H; R.dpr = dpr;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  R.cx = W/2;
  R.floorY = H*0.775;
  R.ringA = Math.min(W*0.435, 198);
  R.ringB = Math.min(H*0.087, 78);
  R.dancerH = H*0.445;
  R.dancerFeet = R.floorY + H*0.014;
  buildBackdrop();
  buildVignette();
}

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

function curtainPath(W, H, side){
  const w = W*0.155;
  const top = -12, bot = H*0.87;
  const edgeX = side<0 ? w : W-w;
  const p = new Path2D();
  p.moveTo(side<0?0:W, top);
  p.lineTo(edgeX, top);
  const segs = 6, step = (bot-top)/segs;
  for(let i=0;i<segs;i++){
    const y0 = top + i*step, y1 = y0 + step;
    const bulge = (i%2===0 ? 1 : -1) * w*0.17;
    p.quadraticCurveTo(edgeX + side*bulge, (y0+y1)/2, edgeX + side*w*0.02, y1);
  }
  p.lineTo(side<0?0:W, bot);
  p.closePath();
  return {path:p, w, top, bot, edgeX};
}

function curtain(g, W, H, side){
  const {path, w, top, bot, edgeX} = curtainPath(W, H, side);
  const g0 = g.createLinearGradient(side<0?0:W, 0, edgeX, 0);
  g0.addColorStop(0,'rgba(50,16,50,.97)');
  g0.addColorStop(0.42,'rgba(94,38,84,.94)');
  g0.addColorStop(0.80,'rgba(58,20,56,.96)');
  g0.addColorStop(1,'rgba(34,10,36,.99)');
  g.save();
  g.fillStyle = g0;
  g.fill(path);
  /* velvet fold highlights, clipped to the drape */
  g.clip(path);
  for(let i=0;i<5;i++){
    const x = (side<0?0:W) + side*(w*(0.12 + i*0.17));
    const lg = g.createLinearGradient(x-8,0,x+8,0);
    lg.addColorStop(0,'rgba(255,200,240,0)');
    lg.addColorStop(.5,'rgba(255,208,242,'+(0.085+0.045*(i%2)).toFixed(3)+')');
    lg.addColorStop(1,'rgba(255,200,240,0)');
    g.fillStyle = lg;
    g.fillRect(x-8, top, 16, bot-top);
  }
  /* gold trim along the inner edge */
  g.strokeStyle = 'rgba(246,223,176,.34)';
  g.lineWidth = 1.5;
  g.beginPath();
  g.moveTo(edgeX, top);
  const segs = 6, step = (bot-top)/segs;
  for(let i=0;i<segs;i++){
    const y0 = top + i*step, y1 = y0 + step;
    const bulge = (i%2===0 ? 1 : -1) * w*0.17;
    g.quadraticCurveTo(edgeX + side*bulge, (y0+y1)/2, edgeX + side*w*0.02, y1);
  }
  g.stroke();
  g.restore();
}

function buildBackdrop(){
  const W = R.W, H = R.H, dpr = R.dpr;
  const c = document.createElement('canvas');
  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
  const g = c.getContext('2d');
  g.scale(dpr,dpr);

  const A = R.palette === 'A';
  const sky = g.createLinearGradient(0,0,0,H*0.86);
  if(A){
    sky.addColorStop(0,'#22102f'); sky.addColorStop(0.34,'#3a1a4c');
    sky.addColorStop(0.62,'#5a2a5c'); sky.addColorStop(0.82,'#7c3a63');
    sky.addColorStop(1,'#8c4468');
  }else{
    sky.addColorStop(0,'#1b1030'); sky.addColorStop(0.34,'#2f2149');
    sky.addColorStop(0.62,'#4a3465'); sky.addColorStop(0.82,'#705081');
    sky.addColorStop(1,'#8a6a94');
  }
  g.fillStyle = sky; g.fillRect(0,0,W,H);

  /* warm glow behind dancer */
  const rg = g.createRadialGradient(W/2,H*0.60,10,W/2,H*0.60,W*0.9);
  rg.addColorStop(0, A?'rgba(255,190,225,.30)':'rgba(200,220,255,.22)');
  rg.addColorStop(0.42,'rgba(186,120,190,.12)');
  rg.addColorStop(1,'rgba(18,6,28,0)');
  g.fillStyle = rg; g.fillRect(0,0,W,H);

  /* moon */
  const mx = A? W*0.215 : W*0.785, my = A? H*0.170 : H*0.150;
  const mr = Math.min(W*0.145, 62);
  const halo = g.createRadialGradient(mx,my,mr*0.6,mx,my,mr*3.6);
  halo.addColorStop(0,'rgba(255,242,212,.34)');
  halo.addColorStop(0.32,'rgba(255,226,196,.13)');
  halo.addColorStop(1,'rgba(255,220,190,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(mx,my,mr*3.6,0,TAU); g.fill();
  g.save();
  g.beginPath(); g.arc(mx,my,mr,0,TAU); g.clip();
  const mg = g.createLinearGradient(mx-mr,my-mr,mx+mr,my+mr);
  mg.addColorStop(0,'#fff9ea'); mg.addColorStop(0.6,'#fdf0d2'); mg.addColorStop(1,'#f0dcb4');
  g.fillStyle = mg; g.fillRect(mx-mr,my-mr,mr*2,mr*2);
  g.fillStyle = 'rgba(214,186,150,.20)';
  [[0.28,-0.24,0.13],[-0.2,0.12,0.09],[0.05,0.3,0.07],[-0.32,-0.3,0.06]].forEach(([dx,dy,r])=>{
    g.beginPath(); g.arc(mx+dx*mr, my+dy*mr, r*mr, 0, TAU); g.fill();
  });
  g.restore();

  /* stars + dust */
  const rnd = mulberry32(A?7:19);
  for(let i=0;i<78;i++){
    const x = rnd()*W, y = rnd()*H*0.72;
    const r = 0.5 + rnd()*1.5;
    const a = 0.15 + rnd()*0.55;
    g.fillStyle = 'rgba(255,244,252,'+a.toFixed(3)+')';
    g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
    if(r>1.3){
      g.globalAlpha = a*0.5;
      g.strokeStyle = '#fff';
      g.lineWidth = 0.6;
      g.beginPath(); g.moveTo(x-r*3,y); g.lineTo(x+r*3,y); g.moveTo(x,y-r*3); g.lineTo(x,y+r*3); g.stroke();
      g.globalAlpha = 1;
    }
  }
  for(let i=0;i<18;i++){
    const x = rnd()*W, y = H*0.18 + rnd()*H*0.6, r = 16 + rnd()*44;
    const bg = g.createRadialGradient(x,y,0,x,y,r);
    bg.addColorStop(0,'rgba(255,215,245,.10)');
    bg.addColorStop(1,'rgba(255,215,245,0)');
    g.fillStyle = bg; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }

  /* stage floor */
  const fy = R.floorY;
  g.save();
  g.beginPath(); g.ellipse(W/2, fy, W*0.72, R.ringB*1.75, 0, 0, TAU);
  const fg = g.createRadialGradient(W/2,fy-R.ringB*0.2,10,W/2,fy,R.ringB*1.8);
  fg.addColorStop(0, A?'rgba(255,214,240,.20)':'rgba(220,232,255,.17)');
  fg.addColorStop(0.55, A?'rgba(180,120,180,.13)':'rgba(150,150,200,.11)');
  fg.addColorStop(1,'rgba(30,12,40,0)');
  g.fillStyle = fg; g.fill();
  g.restore();
  /* horizon sheen */
  const hl = g.createLinearGradient(0,fy-R.ringB*1.2,0,fy+R.ringB*0.2);
  hl.addColorStop(0,'rgba(255,235,250,0)');
  hl.addColorStop(0.7, A?'rgba(255,225,245,.10)':'rgba(220,235,255,.09)');
  hl.addColorStop(1,'rgba(255,235,250,0)');
  g.fillStyle = hl; g.fillRect(0,fy-R.ringB*1.2,W,R.ringB*1.4);

  /* curtains */
  curtain(g, W, H, -1);
  curtain(g, W, H, 1);

  /* top valance */
  g.save();
  const vh = H*0.072;
  const vg = g.createLinearGradient(0,0,0,vh*2.0);
  vg.addColorStop(0,'rgba(58,18,56,.98)');
  vg.addColorStop(0.52,'rgba(102,42,90,.94)');
  vg.addColorStop(1,'rgba(56,20,56,.90)');
  g.fillStyle = vg;
  g.beginPath();
  g.moveTo(0,0); g.lineTo(W,0); g.lineTo(W, vh*0.55);
  const nb = 7;
  for(let i=nb-1;i>=0;i--){
    const x0 = i*(W/nb), x1 = (i+1)*(W/nb);
    g.quadraticCurveTo((x0+x1)/2, vh*1.9, x0, vh*0.55);
  }
  g.closePath(); g.fill();
  g.strokeStyle = 'rgba(246,223,176,.26)';
  g.lineWidth = 1.3;
  g.beginPath();
  g.moveTo(W, vh*0.55);
  for(let i=nb-1;i>=0;i--){
    const x0 = i*(W/nb), x1 = (i+1)*(W/nb);
    g.quadraticCurveTo((x0+x1)/2, vh*1.9, x0, vh*0.55);
  }
  g.stroke();
  g.restore();

  /* edge vignette on backdrop */
  BG = c;
}

function buildVignette(){
  const W = R.W, H = R.H, dpr = R.dpr;
  const c = document.createElement('canvas');
  c.width = Math.round(W*dpr); c.height = Math.round(H*dpr);
  const g = c.getContext('2d');
  g.scale(dpr,dpr);
  const vg = g.createRadialGradient(W/2,H*0.55,Math.min(W,H)*0.32,W/2,H*0.55,Math.max(W,H)*0.82);
  vg.addColorStop(0,'rgba(8,2,16,0)');
  vg.addColorStop(0.72,'rgba(8,2,16,.10)');
  vg.addColorStop(1,'rgba(6,1,12,.52)');
  g.fillStyle = vg; g.fillRect(0,0,W,H);
  const tg = g.createLinearGradient(0,H*0.86,0,H);
  tg.addColorStop(0,'rgba(6,1,12,0)');
  tg.addColorStop(1,'rgba(6,1,12,.55)');
  g.fillStyle = tg; g.fillRect(0,H*0.86,W,H*0.14);
  VIG = c;
}

/* ============================================================
   game state
   ============================================================ */
const S = {
  state:'title', stage:0, def:SONGS[0], chart:[], events:[], evPtr:0,
  t0:0, dur:0, lead:0, songTime:-99,
  score:0, combo:0, maxCombo:0, counts:{perfect:0,good:0,nice:0,miss:0}, total:0,
  particles:[], ripples:[], motes:[],
  pose:'a', bounce:0, spinT:9, tilt:0, flip:false,
  beatPulse:0, lastBeat:-9, beatIdx:-9,
  hintT:0, wandT:9, wandSide:0,
  muted:false, lastCount:-1, accShot:false
};
const LEAD = 1.55;   /* seconds a note travels */
let lastTs = 0;

try{ S.muted = localStorage.getItem('sugar_rhythm_mute') === '1'; }catch(e){}
function syncMute(){
  $('btnMute').textContent = S.muted? '🔇':'🔊';
  AU.setMute(S.muted);
}

function songNow(){
  const c = AU.ctx;
  const base = c? c.currentTime : performance.now()/1000;
  return base - S.t0;
}

/* ---------------- particles ---------------- */
function spark(x,y,vx,vy,life,size,color,type){
  if(S.particles.length>320) S.particles.shift();
  S.particles.push({x,y,vx,vy,life,max:life,size,color,type:type||'spark',
    rot:Math.random()*TAU, vr:(Math.random()-0.5)*4});
}
function burst(x,y,n,power,palette){
  const cols = palette || ['#ffe6f5','#ffc6e6','#d8ecff','#fff0c4','#e3d2ff'];
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU, sp = (0.4+Math.random())*power;
    spark(x,y,Math.cos(a)*sp, Math.sin(a)*sp*0.75 - 0.3*power,
     0.55+Math.random()*0.55, 2+Math.random()*4.5,
     cols[(Math.random()*cols.length)|0], Math.random()<0.45?'petal':'spark');
  }
}
function ripple(x,y,r0,r1,life,color){
  S.ripples.push({x,y,r0,r1,t:0,life,color});
}

/* ---------------- charts / play ---------------- */
function startStage(idx){
  S.stage = idx;
  const def = SONGS[idx];
  S.def = def;
  const built = buildStage(def);
  S.chart = built.chart; S.events = built.events; S.evPtr = 0;
  S.dur = built.dur; S.lead = built.lead;
  S.total = S.chart.length;
  S.score = 0; S.combo = 0; S.maxCombo = 0;
  S.counts = {perfect:0,good:0,nice:0,miss:0};
  S.particles.length = 0; S.ripples.length = 0;
  S.pose='a'; S.bounce=0; S.spinT=9; S.tilt=0; S.flip=false;
  S.beatPulse=0; S.lastBeat=-9; S.lastCount=-1; S.accShot=false;
  S.hintT = 999; S.wandT = 9;
  R.palette = def.palette;

  AU.init(); AU.resume();
  layout();
  S.t0 = (AU.ctx? AU.ctx.currentTime : performance.now()/1000) + 0.38;
  S.songTime = -0.38;

  S.state = 'play';
  $('screenTitle').classList.add('hidden');
  $('screenResult').classList.add('hidden');
  $('hud').classList.remove('hidden');
  $('hudAct').textContent = def.act;
  $('hudSong').textContent = def.title;
  $('hudScore').textContent = '0';
  $('hudProg').style.width = '0%';
  $('hudStar').style.left = '0%';
  $('combo').classList.remove('on');
  $('judge').className = 'judge';
  $('judge').textContent = '';
  syncMute();
}

function showTitle(){
  S.state = 'title';
  $('screenResult').classList.add('hidden');
  $('screenTitle').classList.remove('hidden');
  $('hud').classList.add('hidden');
  $('combo').classList.remove('on');
  $('judge').className = 'judge';
  R.palette = 'A'; layout();
  refreshBest();
}

function popJudge(text, cls){
  const el = $('judge');
  el.textContent = text;
  el.className = 'judge ' + cls;
  void el.offsetWidth;
  el.classList.add('on');
}

function setCombo(v){
  S.combo = v;
  const el = $('combo');
  $('comboNum').textContent = v;
  if(v >= 3){
    el.classList.add('on');
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }else{
    el.classList.remove('on');
  }
}

function addScore(base){
  const mult = 1 + Math.min(S.combo, 40)/40;
  S.score += Math.round(base*mult);
  $('hudScore').textContent = S.score.toLocaleString('ko-KR');
}

function doDance(note){
  S.pose = note.pose;
  S.bounce = Math.min(1.4, S.bounce + (note.strong?1.05:0.62));
  if(note.spin) S.spinT = 0;
  if(note.pose === 'cast_a' || note.pose === 'cast_b'){
    S.wandT = 0; S.wandSide = note.pose==='cast_a'?0:1;
  }
}

function judge(){
  if(S.state !== 'play') return;
  const st = songNow();
  if(st < S.lead - 1.2) return;
  let best = null, bestAbs = 1e9;
  for(let i=0;i<S.chart.length;i++){
    const n = S.chart[i];
    if(n.done) continue;
    const d = Math.abs(n.t - st)*1000;
    if(d < bestAbs){ bestAbs = d; best = n; }
    if(n.t - st > 0.6) break;
  }
  if(!best){ AU.tiny(); return; }
  const d = st - best.t;   /* + = late */
  const abs = Math.abs(d)*1000;

  if(abs <= 140){
    best.done = true; best.out = 1;
    S.counts.perfect++;
    setCombo(S.combo+1); S.maxCombo = Math.max(S.maxCombo, S.combo);
    addScore(120);
    hitFx(best, 1.0);
    popJudge('PERFECT', 'perfect');
    danceHit(best);
    AU.tap(best.m);
    if(S.combo > 0 && S.combo % 10 === 0 && S.combo >= 10) comboBonus();
  }else if(abs <= 260){
    best.done = true; best.out = 1;
    S.counts.good++;
    setCombo(S.combo+1); S.maxCombo = Math.max(S.maxCombo, S.combo);
    addScore(80);
    hitFx(best, 0.72);
    popJudge('GOOD', 'good');
    danceHit(best);
    AU.tap(best.m);
  }else if(abs <= 420){
    best.done = true; best.out = 1;
    S.counts.nice++;
    setCombo(S.combo+1); S.maxCombo = Math.max(S.maxCombo, S.combo);
    addScore(45);
    hitFx(best, 0.45);
    popJudge('NICE', 'nice');
    danceHit(best);
    AU.tap(best.m);
  }else if(d < 0){
    /* too early: no penalty, just a soft tick */
    AU.tiny();
  }else{
    missed(best);
    AU.tiny();
  }
}

function danceHit(note){
  doDance(note);
  if(note.spin) S.flip = false;
}

function hitFx(note, power){
  const pt = notePoint(note, 1);
  burst(pt.x, pt.y, Math.round(8 + 12*power), 1.5*power + 0.5);
  ripple(pt.x, pt.y, 8, 46 + 34*power, 0.55 + 0.25*power, 'rgba(255,225,245,');
  if(power >= 0.99){
    burst(R.cx, R.floorY - R.dancerH*0.55, 6, 1.1, ['#fff2c6','#ffe0b0','#fffdf0']);
  }
}

function comboBonus(){
  const bonus = 150 + S.combo*10;
  S.score += bonus;
  $('hudScore').textContent = S.score.toLocaleString('ko-KR');
  popJudge('COMBO BONUS +' + bonus, 'bonus');
  burst(R.cx, R.floorY - R.dancerH*0.7, 16, 2.0, ['#fff0bd','#ffe6a8','#fffdf2']);
  if(navigator.vibrate) { try{ navigator.vibrate(14); }catch(e){} }
}

function missed(note){
  if(note.done) return;
  note.done = true; note.out = 1;
  S.counts.miss++;
  setCombo(0);
  popJudge('MISS', 'miss');
  const pt = notePoint(note, 1);
  ripple(pt.x, pt.y, 10, 34, 0.5, 'rgba(190,170,205,');
}

function notePoint(note, r){
  const a = R.ringA*r;
  const b = R.ringB*(1 + (r-1)*1.9);
  return { x: R.cx + Math.cos(note.ang)*a, y: R.floorY + Math.sin(note.ang)*b };
}

function endSong(){
  if(S.state !== 'play') return;
  S.state = 'result';
  AU.finale();
  const t = S.total || 1;
  const acc = (S.counts.perfect*1 + S.counts.good*0.72 + S.counts.nice*0.4)/t;
  const stars = acc >= 0.90 ? 3 : acc >= 0.72 ? 2 : 1;
  const pct = Math.round(acc*100);
  $('resKicker').textContent = S.def.act + ' · ' + S.def.title;
  $('resTitle').textContent = stars===3? '빛나는 피날레!' : stars===2? '멋진 무대였어요' : '따뜻한 무대였어요';
  $('resStars').innerHTML = '★★★'.slice(0,stars) + '<span class="off">' + '★★★'.slice(stars) + '</span>';
  $('resScore').textContent = S.score.toLocaleString('ko-KR');
  $('resCombo').textContent = S.maxCombo;
  $('resAcc').textContent = pct + '%';
  $('resP').textContent = S.counts.perfect;
  $('resG').textContent = S.counts.good;
  $('resN').textContent = S.counts.nice;
  $('resM').textContent = S.counts.miss;
  $('btnNext').textContent = S.stage === 0? '다음 곡' : '1막 다시';

  let rec = false;
  try{
    const k = 'sugar_rhythm_best_' + S.def.key;
    const prev = parseInt(localStorage.getItem(k)||'0',10);
    if(S.score > prev){ localStorage.setItem(k, String(S.score)); rec = prev>0; }
  }catch(e){}
  $('resNew').classList.toggle('hidden', !rec);
  $('hud').classList.add('hidden');
  $('combo').classList.remove('on');
  $('judge').className = 'judge';
  S.particles.length = 0;
  for(let i=0;i<4;i++){
    setTimeout(()=> burst(R.cx + (Math.random()-0.5)*160, R.H*0.42 + (Math.random()-0.5)*90, 14, 1.6,
      ['#ffe6f5','#fff0c4','#d8ecff']), 120*i);
  }
  setTimeout(()=>{ $('screenResult').classList.remove('hidden'); }, 420);
}

function refreshBest(){
  let b1 = 0, b2 = 0;
  try{
    b1 = parseInt(localStorage.getItem('sugar_rhythm_best_waltz')||'0',10);
    b2 = parseInt(localStorage.getItem('sugar_rhythm_best_sugar')||'0',10);
  }catch(e){}
  const el = $('best2');
  if(el) el.textContent = b2>0? '· 최고 '+b2.toLocaleString('ko-KR') : '';
  const s = $('btnStart');
  if(s && b1>0){
    s.querySelector('em').textContent = '최고 ' + b1.toLocaleString('ko-KR');
  }
}

/* ============================================================
   update
   ============================================================ */
function update(dt){
  const st = songNow();
  S.songTime = st;

  if(S.state === 'play'){
    scheduleAudio();

    /* beat pulse */
    const beat = S.def.beat;
    const bi = Math.floor((st - S.lead)/beat);
    if(bi !== S.beatIdx && st > S.lead - S.def.beat*3){
      S.beatIdx = bi;
      S.beatPulse = 1;
      /* count-in */
      const remain = S.lead - st;
      if(remain > 0){
        const c = Math.ceil(remain/beat);
        if(c !== S.lastCount && c <= 3){ S.lastCount = c; popJudge(String(c), 'count'); }
      }
    }

    /* misses */
    for(let i=0;i<S.chart.length;i++){
      const n = S.chart[i];
      if(!n.done && st - n.t > 0.42) missed(n);
    }

    /* progress */
    const p = clamp(st/S.dur, 0, 1);
    $('hudProg').style.width = (p*100).toFixed(2)+'%';
    $('hudStar').style.left = (p*100).toFixed(2)+'%';

    if(st > S.dur + 0.4) endSong();
  }

  if(S.state === 'play' || S.state === 'result'){
    S.beatPulse *= Math.exp(-dt*4.2);
    S.bounce *= Math.exp(-dt*7.5);
    S.spinT += dt;
    S.wandT += dt;
    S.tilt += (Math.sin(st*1.4)*0.012 - S.tilt)*Math.min(1, dt*6);
  }

  /* particles */
  for(let i=S.particles.length-1;i>=0;i--){
    const p = S.particles[i];
    p.life -= dt;
    if(p.life <= 0){ S.particles.splice(i,1); continue; }
    p.x += p.vx*dt*60; p.y += p.vy*dt*60;
    p.vy += 0.012*dt*60;
    p.vx *= 0.992; p.vy *= 0.994;
    p.rot += p.vr*dt;
  }
  for(let i=S.ripples.length-1;i>=0;i--){
    S.ripples[i].t += dt;
    if(S.ripples[i].t >= S.ripples[i].life) S.ripples.splice(i,1);
  }
}

function scheduleAudio(){
  const c = AU.ctx; if(!c) return;
  const horizon = c.currentTime + 0.45;
  while(S.evPtr < S.events.length){
    const e = S.events[S.evPtr];
    const at = S.t0 + e.at;
    if(at > horizon) break;
    S.evPtr++;
    if(at < c.currentTime - 0.08) continue;
    if(e.kind === 'mel') AU.bell(at, e.m, e.dur, e.g, e.g>0.09?1.05:0.85);
    else if(e.kind === 'bass') AU.bass(at, e.m, e.dur, e.g);
    else if(e.kind === 'shk') AU.shk(at, e.g);
  }
}

/* ============================================================
   render
   ============================================================ */
function drawBeams(st){
  const W = R.W, H = R.H;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const sway = Math.sin(st*0.36)*0.05;
  const sway2 = Math.cos(st*0.28)*0.05;
  for(let i=0;i<3;i++){
    const ox = W*(0.5 + (i-1)*0.30) + (i===1? Math.sin(st*0.5)*18 : 0);
    const topX = W*0.5 + (i-1)*W*0.16;
    const g = ctx.createLinearGradient(topX, 0, ox, H*0.86);
    const a = (i===1? 0.13 : 0.085) * (0.65 + S.beatPulse*0.35);
    g.addColorStop(0,'rgba(255,235,250,'+a.toFixed(3)+')');
    g.addColorStop(0.55,'rgba(255,205,240,'+(a*0.42).toFixed(3)+')');
    g.addColorStop(1,'rgba(255,200,240,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    const spread = W*(0.10 + 0.02*i);
    ctx.moveTo(topX - W*0.035, 0);
    ctx.lineTo(topX + W*0.035, 0);
    ctx.lineTo(ox + spread + sway*40, H*0.88);
    ctx.lineTo(ox - spread + sway2*40, H*0.88);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function drawFloorPool(){
  const {cx, floorY} = R;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(cx, floorY, 4, cx, floorY, R.ringA*0.95);
  g.addColorStop(0,'rgba(255,228,248,'+(0.16+S.beatPulse*0.07).toFixed(3)+')');
  g.addColorStop(0.5,'rgba(255,196,236,0.07)');
  g.addColorStop(1,'rgba(255,190,235,0)');
  ctx.save();
  ctx.translate(cx, floorY); ctx.scale(1, R.ringB/R.ringA*1.15);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,R.ringA,0,TAU); ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawRing(st){
  const {cx, floorY, ringA, ringB} = R;
  const pulse = S.beatPulse;
  ctx.save();
  ctx.translate(cx, floorY);

  /* soft glow band */
  ctx.globalCompositeOperation = 'lighter';
  const gb = ctx.createRadialGradient(0,0,ringA*0.55,0,0,ringA*1.10);
  gb.addColorStop(0,'rgba(255,190,235,0)');
  gb.addColorStop(0.68,'rgba(255,180,230,'+(0.07+pulse*0.10).toFixed(3)+')');
  gb.addColorStop(1,'rgba(255,235,250,0)');
  ctx.save();
  ctx.scale(1, ringB/ringA*1.02);
  ctx.fillStyle = gb; ctx.beginPath(); ctx.arc(0,0,ringA*1.10,0,TAU); ctx.fill();
  ctx.restore();

  /* main ellipse */
  ctx.lineWidth = 1.7 + pulse*1.9;
  ctx.strokeStyle = 'rgba(255,230,248,'+(0.30+pulse*0.32).toFixed(3)+')';
  ctx.beginPath(); ctx.ellipse(0,0,ringA,ringB,0,0,TAU); ctx.stroke();

  /* dashed turning ring */
  ctx.setLineDash([5, 13]);
  ctx.lineDashOffset = -st*26;
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = 'rgba(255,214,242,'+(0.20+pulse*0.16).toFixed(3)+')';
  ctx.beginPath(); ctx.ellipse(0,0,ringA*0.955,ringB*0.955,0,0,TAU); ctx.stroke();
  ctx.setLineDash([]);

  /* rune ticks */
  const n = 12;
  for(let i=0;i<n;i++){
    const a = (i/n)*TAU + st*0.10;
    const x = Math.cos(a)*ringA, y = Math.sin(a)*ringB;
    const s = (i%3===0? 3.4:2.2) * (1 + pulse*0.55);
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(a);
    ctx.globalAlpha = (i%3===0? 0.55:0.32) + pulse*0.35;
    ctx.fillStyle = i%3===0? '#ffe9c4':'#ffd6f0';
    ctx.beginPath();
    ctx.moveTo(0,-s); ctx.lineTo(s*0.62,0); ctx.lineTo(0,s); ctx.lineTo(-s*0.62,0);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* hit ripples */
  for(const rp of S.ripples){
    const p = rp.t/rp.life;
    const rr = rp.r0 + (rp.r1-rp.r0)*easeOut(p);
    const al = (1-p)*0.75;
    ctx.strokeStyle = rp.color + al.toFixed(3) + ')';
    ctx.lineWidth = 2.2*(1-p)+0.4;
    ctx.beginPath();
    ctx.ellipse(rp.x-cx, rp.y-floorY, rr, rr*(ringB/ringA), 0,0,TAU);
    ctx.stroke();
  }
  ctx.restore();
}
function easeOut(p){ return 1-Math.pow(1-p,3); }

function dancerGeom(){
  const img = IMG[S.pose] || IMG.a;
  const h = R.dancerH;
  const ratio = (img && img.width)? img.width/img.height : 0.718;
  return { img, h, w: h*ratio };
}

function drawDancerReflection(){
  const {img,h,w} = dancerGeom();
  if(!img || !img.width) return;
  const feet = R.dancerFeet + 2;
  const strips = 9;
  const totalH = h*0.5;
  ctx.save();
  for(let i=0;i<strips;i++){
    const t0 = i/strips, t1 = (i+1)/strips;
    ctx.globalAlpha = 0.15*Math.pow(1-t0, 1.5);
    const sy = t1*totalH, sh = (t1-t0)*totalH;
    ctx.drawImage(img,
      0, img.height*(1-t1), img.width, img.height*(t1-t0),
      R.cx - w/2, feet + sy, w, sh);
  }
  ctx.restore();
}

function drawDancer(){
  const {img,h,w} = dancerGeom();
  if(!img || !img.width) return;
  const bounce = S.bounce;
  const hop = bounce*16;
  const spinP = S.spinT < 0.52 ? S.spinT/0.52 : 1;
  const spinning = S.spinT < 0.52;
  let sx = 1 + bounce*0.035;
  const sy = 1 - bounce*0.03;
  if(spinning){
    const c = Math.cos(spinP*TAU);
    sx *= 0.55 + 0.45*Math.abs(c);
  }
  ctx.save();
  ctx.translate(R.cx, R.dancerFeet - hop);
  ctx.rotate(S.tilt + (bounce*0.008));
  ctx.scale((S.flip?-1:1)*sx, sy);
  /* contact shadow */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.restore();
  ctx.drawImage(img, -w/2, -h, w, h);
  ctx.restore();

  /* wand sparkles */
  if((S.pose==='cast_a'||S.pose==='cast_b') && S.wandT < 1.6 && Math.random()<0.34){
    const tip = WAND_TIP[S.pose];
    const wx = R.cx + (tip[0]-0.5)*w*(S.flip?-1:1);
    const wy = R.dancerFeet - hop - h*(1-tip[1]);
    spark(wx, wy, (Math.random()-0.5)*0.7, -0.5-Math.random()*0.6,
      0.5+Math.random()*0.4, 1.6+Math.random()*2.6, '#fff0c4','spark');
  }
}

function drawSparkle(x,y,s,rot,color,alpha){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0,0,0,0,0,s*2.1);
  g.addColorStop(0,'rgba(255,255,255,.85)');
  g.addColorStop(0.35,color);
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0,0,s*2.1,0,TAU); ctx.fill();

  ctx.fillStyle = '#fffdfd';
  ctx.beginPath();
  for(let i=0;i<4;i++){
    const a = (i*Math.PI)/2;
    const a2 = a + Math.PI/4;
    const R1 = s, R2 = s*0.30;
    const x1 = Math.cos(a)*R1, y1 = Math.sin(a)*R1;
    const x2 = Math.cos(a2)*R2, y2 = Math.sin(a2)*R2;
    if(i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1);
    ctx.lineTo(x2,y2);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

const NOTE_COLORS = ['#ffe6f5','#cdf0ff','#e6d8ff','#ffe8bf'];

function drawNotes(st){
  const {cx, floorY, ringA, ringB} = R;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  /* target marks */
  for(let i=0;i<S.chart.length;i++){
    const n = S.chart[i];
    if(n.done) continue;
    const dt = n.t - st;
    if(dt < -0.2 || dt > LEAD) continue;
    const a = clamp(1 - dt/LEAD, 0, 1);
    const x = cx + Math.cos(n.ang)*ringA;
    const y = floorY + Math.sin(n.ang)*ringB;
    const s = 3 + a*3.6;
    ctx.globalAlpha = 0.16 + a*0.6;
    ctx.fillStyle = '#ffe9f6';
    ctx.save();
    ctx.translate(x,y); ctx.rotate(Math.PI/4);
    ctx.fillRect(-s/2,-s/2,s,s);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  /* notes */
  for(let i=0;i<S.chart.length;i++){
    const n = S.chart[i];
    if(n.done) continue;
    const dt = n.t - st;
    if(dt < -0.25 || dt > LEAD + 0.15) continue;
    const k = clamp(dt/LEAD, 0, 1);
    const r = 1 + Math.pow(k, 0.92)*2.35;
    const col = NOTE_COLORS[i % NOTE_COLORS.length];
    const alpha = clamp((LEAD + 0.15 - dt)/0.4, 0, 1) * clamp(1 - (-dt)/0.25, 0, 1);
    const sc = (0.72 + 0.28*(1/r)) * (n.strong? 1.18: 1);

    /* trail */
    for(let j=3;j>=1;j--){
      const tp = notePoint(n, r + j*0.07);
      drawSparkle(tp.x, tp.y, (n.strong?4.2:3.2)*sc*(1-j*0.14), n.ang,
        col, alpha * 0.16 * (1-j*0.22));
    }
    const np = notePoint(n, r);
    const x = np.x, y = np.y;
    drawSparkle(x, y, (n.strong? 6.4:5.2)*sc, n.ang + st*0.6, col, alpha*0.95);

    /* inner gem */
    ctx.globalAlpha = alpha*0.85;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x,y, (n.strong?2.4:1.9)*sc, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawParticles(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const p of S.particles){
    const t = p.life/p.max;
    const a = Math.min(1, t*1.6);
    if(p.type === 'petal'){
      ctx.save();
      ctx.globalAlpha = a*0.85;
      ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.ellipse(0,0,p.size, p.size*0.55, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
    }else{
      drawSparkle(p.x, p.y, p.size*0.9, p.rot, p.color, a);
    }
  }
  ctx.restore();
}

function drawMotes(st){
  /* slow floating dust, procedural */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<26;i++){
    const seed = i*97.13;
    const x = (seed*53.7 + Math.sin(st*0.24 + i)*22) % R.W;
    const y = R.H*0.92 - ((st*12 + i*73) % (R.H*0.86));
    const r = 0.9 + (i%3)*0.6;
    const a = 0.10 + 0.12*Math.abs(Math.sin(st*0.9 + i));
    ctx.fillStyle = 'rgba(255,240,250,'+a.toFixed(3)+')';
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function render(){
  const st = S.songTime;
  ctx.clearRect(0,0,R.W,R.H);
  if(BG) ctx.drawImage(BG, 0, 0, R.W, R.H);
  drawBeams(st);
  drawMotes(st);
  drawFloorPool();
  drawRing(st);
  if(S.state === 'play' || S.state === 'result'){
    drawDancerReflection();
    drawDancer();
    if(S.state === 'play') drawNotes(st);
    drawParticles();
  }else{
    /* idle dancer on title */
    drawDancerReflection();
    drawDancer();
  }
  if(VIG) ctx.drawImage(VIG, 0, 0, R.W, R.H);
}

/* ============================================================
   loop
   ============================================================ */
function frame(ts){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs)/1000 || 0.016));
  lastTs = ts;
  update(dt);
  render();
}

/* ============================================================
   input
   ============================================================ */
function onTap(e){
  if(S.state !== 'play') return;
  const t = e.target;
  if(t && t.closest && t.closest('button')) return;
  judge();
}

window.addEventListener('pointerdown', onTap, {passive:true});
window.addEventListener('keydown', (e)=>{
  if(e.code === 'Space' || e.code === 'Enter' || e.key === ' '){
    if(S.state === 'play'){ e.preventDefault(); judge(); }
    else if(S.state === 'result' && e.code === 'Enter'){
      if(!$('screenResult').classList.contains('hidden')) $('btnRetry').click();
    }
  }
});

$('btnStart').addEventListener('click', ()=>{ AU.init(); startStage(0); });
$('btnAct2').addEventListener('click', ()=>{ AU.init(); startStage(1); });
$('btnRetry').addEventListener('click', ()=>{ startStage(S.stage); });
$('btnNext').addEventListener('click', ()=>{
  if(S.stage === 0) startStage(1);
  else startStage(0);
});
$('btnHome').addEventListener('click', showTitle);
$('btnMute').addEventListener('click', (e)=>{
  e.stopPropagation();
  S.muted = !S.muted;
  try{ localStorage.setItem('sugar_rhythm_mute', S.muted?'1':'0'); }catch(err){}
  syncMute();
});

document.addEventListener('visibilitychange', ()=>{
  if(!AU.ctx) return;
  if(document.hidden){
    if(AU.ctx.state === 'running') AU.ctx.suspend().catch(()=>{});
  }else{
    if(S.state === 'play' && AU.ctx.state === 'suspended') AU.ctx.resume().catch(()=>{});
  }
});

window.addEventListener('resize', ()=>{ layout(); });
if(window.ResizeObserver){
  try{ new ResizeObserver(()=>{ if(app.clientWidth !== R.W) layout(); }).observe(app); }catch(e){}
}

/* ============================================================
   boot
   ============================================================ */
layout();
syncMute();
refreshBest();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
