<meta property="og:description" content="슈가가 시연하는 발레 동작을 맞혀봐! 10문제 취발러 감정 테스트" />
<meta property="og:type" content="website" />
<title>슈가의 발레 용어 퀴즈 🩰</title>

<style>
:root{
  --pink:#f6a8c5; --pink-d:#e87fa8; --pink-deep:#d95f92;
  --ivory:#fffaf3; --cream:#fff3e6;
  --ink:#5c4354; --ink-soft:#8a6f80;
  --mint:#8fd6b9; --gold:#f4c95d;
  --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  background:linear-gradient(180deg,#fdeef4 0%,#fff6ec 60%,#fdeef4 100%);
  color:var(--ink);
  display:flex;justify-content:center;
  min-height:100dvh;
}
#app{
  width:100%;max-width:430px;min-height:100dvh;
  display:flex;flex-direction:column;position:relative;
  background:transparent;
}
.screen{display:none;flex-direction:column;flex:1;padding:14px 16px 20px;}
.screen.on{display:flex}

/* ---------- 공통 ---------- */
.brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--pink-deep)}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--pink);display:inline-block}
.btn{
  border:none;border-radius:18px;font-family:inherit;cursor:pointer;
  font-weight:800;transition:transform .08s ease, box-shadow .08s ease;
}
.btn:active{transform:scale(.97)}
.btn-main{
  background:linear-gradient(135deg,#f7a8c6,#f28fb6);color:#fff;
  box-shadow:0 6px 16px rgba(233,127,168,.35);
  padding:16px 20px;font-size:18px;width:100%;
}
.btn-sub{
  background:#fff;color:var(--pink-deep);
  border:2px solid #f6c3d8;
  padding:13px 18px;font-size:15px;width:100%;
}

/* ---------- 타이틀 ---------- */
#s-title{justify-content:flex-end;gap:12px}
.hero-wrap{position:relative;border-radius:24px;overflow:hidden;flex:1;min-height:340px;
  box-shadow:0 10px 30px rgba(216,130,170,.18);}
#cv-title{width:100%;height:100%;display:block}
.title-card{
  background:rgba(255,255,255,.92);border-radius:24px;padding:22px 20px;
  box-shadow:0 8px 24px rgba(216,130,170,.16);text-align:center;
}
.title-card h1{font-size:26px;letter-spacing:-.5px;color:var(--ink)}
.title-card h1 em{font-style:normal;color:var(--pink-deep)}
.title-card .sub{font-size:14px;color:var(--ink-soft);margin-top:6px;font-weight:600}
.badge-row{display:flex;gap:6px;justify-content:center;margin:12px 0 14px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:700;background:#fdeaf2;color:var(--pink-deep);padding:5px 10px;border-radius:999px}

/* ---------- 퀴즈 ---------- */
#s-quiz{gap:10px}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qtop .pill{background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--ink-soft);box-shadow:0 2px 8px rgba(216,130,170,.12)}
.qtop .score{color:var(--pink-deep)}
.combo{background:linear-gradient(135deg,#f4c95d,#f7a8c6);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:900;box-shadow:0 2px 8px rgba(244,201,93,.4);display:none}
.combo.on{display:inline-block}
.progress{height:8px;border-radius:99px;background:#ffffffaa;overflow:hidden;box-shadow:inset 0 1px 3px rgba(216,130,170,.15)}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f7a8c6,#f28fb6);width:0%;transition:width .3s ease}
.stage-wrap{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(216,130,170,.18);height:296px;flex-shrink:0}
#cv{width:100%;height:100%;display:block}
.stage-ctrl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.stage-ctrl button{
  border:none;background:rgba(255,255,255,.92);border-radius:12px;
  padding:8px 12px;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.12);font-family:inherit;
}
.stage-ctrl button.slow-on{background:#fdeaf2;color:var(--pink-deep)}
.beat-tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.9);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800;color:var(--pink-deep)}
.qcard{
  background:#fff;border-radius:20px;padding:16px;text-align:center;
  box-shadow:0 6px 18px rgba(216,130,170,.14);
}
.qcard .q{font-size:17px;font-weight:800}
.qcard .q b{color:var(--pink-deep)}
.hint-btn{
  margin-top:10px;border:none;background:#fdeaf2;color:var(--pink-deep);
  font-weight:800;font-size:13px;padding:9px 16px;border-radius:999px;cursor:pointer;font-family:inherit;
}
.hint-text{display:none;margin-top:9px;font-size:14px;font-weight:700;color:var(--ink-soft);
  background:#fff7ef;border-radius:12px;padding:9px 12px;}
.hint-text.on{display:block}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.choice{
  border:2px solid #f6d3e0;background:#fff;border-radius:16px;
  padding:13px 8px;font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;
  min-height:64px;transition:border-color .1s, background .1s;
}
.choice .ko{font-size:15.5px;font-weight:800;color:var(--ink)}
.choice .fr{font-size:12px;font-weight:700;color:var(--ink-soft);font-style:italic}
.choice:disabled{cursor:default}
.choice.correct{border-color:#4cae8b;background:#eefaf4}
.choice.correct .ko,.choice.correct .fr{color:#2e8563}
.choice.wrong{border-color:#e98a8a;background:#fdefee}
.choice.wrong .ko,.choice.wrong .fr{color:#c25b5b}
.choice.dim{opacity:.55}
.feedback{display:none;background:#fff;border-radius:20px;padding:15px 16px;box-shadow:0 6px 18px rgba(216,130,170,.14)}
.feedback.on{display:block}
.feedback .verdict{font-weight:900;font-size:16px}
.feedback .verdict.good{color:#2e8563}
.feedback .verdict.bad{color:#c25b5b}
.feedback .ans{font-size:14px;font-weight:800;color:var(--pink-deep);margin-top:3px}
.feedback .exp{font-size:13.5px;line-height:1.55;color:var(--ink-soft);font-weight:600;margin-top:6px}
.feedback .btn-main{margin-top:12px;padding:13px;font-size:16px}

/* ---------- 결과 ---------- */
#s-result{gap:12px;justify-content:flex-start}
.result-card{background:#fff;border-radius:24px;padding:24px 18px;text-align:center;box-shadow:0 8px 24px rgba(216,130,170,.16)}
.grade-emoji{font-size:52px;line-height:1}
.grade-name{font-size:23px;font-weight:900;color:var(--pink-deep);margin-top:8px}
.result-score{font-size:15px;font-weight:700;color:var(--ink-soft);margin-top:6px}
.result-score b{font-size:24px;color:var(--ink)}
.acc{margin-top:10px;display:flex;justify-content:center;gap:8px}
.acc span{background:#fdeaf2;color:var(--pink-deep);font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px}
.grade-bar{margin:16px auto 0;max-width:320px;text-align:left}
.grade-bar .g-item{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-soft);padding:3px 2px;border-radius:8px}
.grade-bar .g-item.now{background:#fdeaf2;color:var(--pink-deep)}
.review{background:#fff;border-radius:20px;padding:16px;box-shadow:0 6px 18px rgba(216,130,170,.14)}
.review h3{font-size:15px;font-weight:900;color:var(--ink);margin-bottom:9px}
.review ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.review li{font-size:13.5px;font-weight:700;padding:9px 12px;border-radius:12px;background:#f7f8f9;color:var(--ink-soft);line-height:1.45}
.review li.ok{background:#eefaf4;color:#2e8563}
.review li b{color:inherit}
.copy-done{display:none;font-size:12.5px;font-weight:800;color:#2e8563;text-align:center;margin-top:6px}
.copy-done.on{display:block}

.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);
  background:#5c4354;color:#fff;font-weight:800;font-size:14px;padding:11px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.25s ease;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

/* ============================================================
   리깅 렌더러 — 슈가 캐릭터
   좌표계: 바닥 중심 원점, y 위쪽(+), 단위 유닛
   ============================================================ */
const THIGH=50, SHIN=48, UPPER=28, FORE=26, TORSO=60, HEAD_R=23;
const C = {
  skin:'#ffe3d2', skinLine:'#eebfa8',
  leotard:'#f7a0c0', leotardD:'#ec82ab',
  tutuA:'#fff1f7', tutuB:'#ffd2e7', tutuC:'#ffc3de',
  hair:'#a5714f', hairD:'#8a5a3d',
  tights:'#ffeaf1', tightsLine:'#e9bccd',
  shoe:'#f7b3cd', shoeD:'#e88cae', ribbon:'#e88cae',
  ink:'#5b4234', blush:'#ffb9c9',
};

function dirV(aDeg){
  const a = aDeg * Math.PI/180;
  return [Math.sin(a), -Math.cos(a)]; // a=0 아래, a=90 정면(+x), a=180 위
}
function add(p, d, len){ return [p[0]+d[0]*len, p[1]+d[1]*len]; }
function lerp(a,b,u){ return a + (b-a)*u; }
function ease(u){ return u<=0?0:u>=1?1:u*u*(3-2*u); }

function cap(ctx, p1, p2, w, color){
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke();
}
function circle(ctx, p, r, color){ ctx.fillStyle=color; ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2); ctx.fill(); }

// 프레임 병합(부분 프레임 지원)
function mergedFrames(step){
  const out = []; let acc = JSON.parse(JSON.stringify(P0));
  for (const f of step.frames){
    deepMerge(acc, f);
    const cp = JSON.parse(JSON.stringify(acc));
    cp.t = f.t;
    out.push(cp);
  }
  out[out.length-1] = JSON.parse(JSON.stringify(out[0]));
  out[out.length-1].t = 1;
  return out;
}
function deepMerge(dst, src){
  for (const k in src){
    if (k==='t') continue;
    if (src[k] && typeof src[k]==='object' && !Array.isArray(src[k])){
      if (!dst[k] || typeof dst[k]!=='object') dst[k]={};
      deepMerge(dst[k], src[k]);
    } else dst[k]=src[k];
  }
}
function samplePose(step, tNorm){
  const fr = step._mf || (step._mf = mergedFrames(step));
  let i = 0;
  while (i < fr.length-2 && tNorm > fr[i+1].t) i++;
  const A = fr[i], B = fr[Math.min(i+1, fr.length-1)];
  const span = Math.max(1e-6, B.t - A.t);
  const u = ease((tNorm - A.t)/span);
  return lerpPose(A, B, u);
}
function lerpPose(a, b, u){
  const r = {};
  for (const k in a){
    if (typeof a[k]==='number') r[k]=lerp(a[k], (typeof b[k]==='number'?b[k]:a[k]), u);
    else if (typeof a[k]==='object') {
      r[k]={};
      for (const k2 in a[k]) r[k][k2] = lerp(a[k][k2], (b[k]&&typeof b[k][k2]==='number'?b[k][k2]:a[k][k2]), u);
    } else r[k]=a[k];
  }
  return r;
}

function drawLimb(ctx, j1, j2, j3, w1, w2, lineC, fillC){
  cap(ctx, j1, j2, w1+3.4, lineC); cap(ctx, j2, j3, w2+3.4, lineC);
  cap(ctx, j1, j2, w1, fillC);     cap(ctx, j2, j3, w2, fillC);
}

function drawSugar(ctx, P, opts){
  opts = opts || {};
  const view = opts.view != null ? opts.view : 0; // 0 side, 1 front
  const side = view === 0;

  ctx.save();
  const sxRaw = P.sx || 1;
  const sxClamped = Math.max(0.28, Math.min(1, Math.abs(sxRaw))) * (sxRaw < 0 ? -1 : 1);
  ctx.scale(sxClamped, 1); // 피루엣 회전 스쿼시 (0이 되어 사라지지 않게 클램프)

  const hip = [P.hipX, P.hipY];
  const neckDir = dirV(180 - P.lean);
  const neck = add(hip, neckDir, TORSO);
  const shoulder = add(hip, neckDir, TORSO-7);
  const headC = add(neck, dirV(180 - P.lean - P.head), 15);
  const shL = side ? shoulder : [shoulder[0]-15, shoulder[1]];
  const shR = side ? shoulder : [shoulder[0]+15, shoulder[1]];
  const hipB = side ? [hip[0]-2, hip[1]-2] : [hip[0]-7, hip[1]-3];
  const hipF = side ? [hip[0]+2, hip[1]-2] : [hip[0]+7, hip[1]-3];

  function armChain(sh, arm, farSide){
    const el = add(sh, dirV(arm.a), UPPER);
    const wr = add(el, dirV(arm.a + arm.b), FORE);
    const hand = add(wr, dirV(arm.a + arm.b), 9);
    drawLimb(ctx, sh, el, wr, 9.5, 8, C.skinLine, C.skin);
    circle(ctx, hand, 5.2, C.skin);
    return [sh, el, wr];
  }
  function legChain(hj, leg, frontLeg){
    const kn = add(hj, dirV(leg.a), THIGH);
    const an = add(kn, dirV(leg.a - leg.k), SHIN);
    // 발: flat 방향 → point 방향 보간
    const shinA = leg.a - leg.k;
    const flat = side ? [0.985,-0.17] : [Math.cos((leg.yaw-16)*Math.PI/180), Math.sin((leg.yaw-16)*Math.PI/180)];
    const point = dirV(shinA);
    const mixv = [lerp(flat[0], point[0], leg.p), lerp(flat[1], point[1], leg.p)];
    const n = Math.hypot(mixv[0], mixv[1]) || 1;
    const toe = add(an, [mixv[0]/n, mixv[1]/n], 24 + leg.p*4);
    drawLimb(ctx, hj, kn, an, 13, 11, C.tightsLine, C.tights);
    // 토슈즈
    ctx.lineCap='round';
    cap(ctx, an, [an[0]+(toe[0]-an[0])*0.55, an[1]+(toe[1]-an[1])*0.55], 12.5, C.shoeD);
    cap(ctx, an, toe, 11, C.shoe);
    circle(ctx, toe, 5.4, C.shoe);
    // 리본
    ctx.strokeStyle=C.ribbon; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(an[0]-5,an[1]-4); ctx.lineTo(an[0]+5,an[1]+4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(an[0]+5,an[1]-4); ctx.lineTo(an[0]-5,an[1]+4); ctx.stroke();
    return [hj, kn, an];
  }

  /* ---- 뒤쪽 팔·다리 ---- */
  legChain(hipB, P.legB, false);
  if (side) armChain(shL, P.armB, true);

  /* ---- 몸통(레오타드) ---- */
  cap(ctx, hip, neck, 21, C.leotardD);
  cap(ctx, hip, add(hip, neckDir, TORSO-12), 20, C.leotard);
  circle(ctx, hip, 13.5, C.leotardD); // 레오타드 하의
  // 목
  cap(ctx, neck, add(neck, dirV(180-P.lean-P.head), 10), 7, C.skin);

  /* ---- 튀튜 ---- */
  ctx.save();
  ctx.translate(hip[0], hip[1]-1);
  ctx.rotate((side? P.lean : P.lean*0.6) * -0.012 + P.tutu*0.02);
  for (let layer=0; layer<2; layer++){
    const col = layer===0 ? C.tutuA : C.tutuB;
    const n = 7, spread = 58;
    for (let i=0;i<n;i++){
      const px = -spread/2 + spread*i/(n-1);
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.ellipse(px + (layer? (i%2?2:-2):0), -4 - layer*1.5, 12.5, 17 + (i%2?2:0), (i-(n-1)/2)*0.08, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.fillStyle = C.leotardD;
  ctx.beginPath(); ctx.ellipse(0, 2, 16, 5.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  /* ---- 앞다리·앞팔 ---- */
  legChain(hipF, P.legF, true);
  if (side) armChain(shR, P.armF, false);
  else { armChain(shL, P.armB, true); armChain(shR, P.armF, false); }

  /* ---- 머리 ---- */
  // 뒤머리
  circle(ctx, [headC[0] + (side?-3:0), headC[1]+1], HEAD_R+1.5, C.hairD);
  circle(ctx, headC, HEAD_R, C.skin);
  // 머리카락(위) + 번머리
  ctx.fillStyle = C.hair;
  ctx.beginPath();
  if (side){
    ctx.arc(headC[0], headC[1]+2, HEAD_R, Math.PI*0.12, Math.PI*0.98, false);
  } else {
    ctx.arc(headC[0], headC[1]+2, HEAD_R, Math.PI*0.06, Math.PI*0.94, false);
  }
  ctx.fill();
  const bunC = side ? [headC[0]-7, headC[1]+HEAD_R+6] : [headC[0], headC[1]+HEAD_R+5];
  circle(ctx, bunC, 9.5, C.hair);
  circle(ctx, [bunC[0]+2.5, bunC[1]+2.5], 3.2, '#c08b63');
  // 앞머리
  ctx.fillStyle = C.hair;
  ctx.beginPath();
  ctx.ellipse(headC[0] + (side? 8:0), headC[1]+13, side?9:16, 6.5, side?0.35:0, 0, Math.PI*2);
  ctx.fill();

  /* ---- 얼굴 ---- */
  ctx.fillStyle = C.ink;
  if (side){
    ctx.beginPath(); ctx.ellipse(headC[0]+11, headC[1]+3, 2.4, 3.4, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle=C.ink; ctx.lineWidth=1.7; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(headC[0]+13, headC[1]-6); ctx.quadraticCurveTo(headC[0]+16, headC[1]-8.5, headC[0]+18.5, headC[1]-5.5); ctx.stroke();
    circle(ctx, [headC[0]+7, headC[1]-3], 3, C.blush);
  } else {
    ctx.beginPath(); ctx.ellipse(headC[0]-8.5, headC[1]+3, 2.3, 3.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(headC[0]+8.5, headC[1]+3, 2.3, 3.3, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle=C.ink; ctx.lineWidth=1.7; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(headC[0]-4, headC[1]-7); ctx.quadraticCurveTo(headC[0], headC[1]-10.5, headC[0]+4, headC[1]-7); ctx.stroke();
    circle(ctx, [headC[0]-14, headC[1]-3], 3.4, C.blush);
    circle(ctx, [headC[0]+14, headC[1]-3], 3.4, C.blush);
  }

  ctx.restore();
}

/* ============================================================
   연습실 무대 그리기
   ============================================================ */
function drawScene(ctx, W, H, floorY, S){
  // 벽
  const wg = ctx.createLinearGradient(0,0,0,floorY);
  wg.addColorStop(0,'#fdeef4'); wg.addColorStop(1,'#fdece2');
  ctx.fillStyle = wg; ctx.fillRect(0,0,W,floorY);
  // 거울
  const mx=26, mw=W-52, mt=26, mh=floorY-118*S-40;
  ctx.fillStyle='#e9d2dc';
  roundRect(ctx, mx-5, mt-5, mw+10, mh+10, 14); ctx.fill();
  const mg = ctx.createLinearGradient(mx,mt,mx+mw,mt+mh);
  mg.addColorStop(0,'#f4f9fb'); mg.addColorStop(0.5,'#e8f1f5'); mg.addColorStop(1,'#f6fafc');
  ctx.fillStyle=mg; roundRect(ctx, mx, mt, mw, mh, 10); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.moveTo(mx+30, mt+mh); ctx.lineTo(mx+80, mt); ctx.lineTo(mx+112, mt); ctx.lineTo(mx+62, mt+mh); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.moveTo(mx+140, mt+mh); ctx.lineTo(mx+185, mt); ctx.lineTo(mx+200, mt); ctx.lineTo(mx+155, mt+mh); ctx.closePath(); ctx.fill();
  // 바 (barre)
  const by = floorY - 116*S;
  ctx.fillStyle='#c9a184';
  roundRect(ctx, 12, by-5, W-24, 10, 5); ctx.fill();
  ctx.fillStyle='#b98e70';
  roundRect(ctx, 54, by-3, 9, 26, 3); ctx.fill();
  roundRect(ctx, W-63, by-3, 9, 26, 3); ctx.fill();
  // 바닥
  const fg = ctx.createLinearGradient(0,floorY,0,H);
  fg.addColorStop(0,'#ddb892'); fg.addColorStop(1,'#c79b74');
  ctx.fillStyle=fg; ctx.fillRect(0,floorY,W,H-floorY);
  ctx.strokeStyle='rgba(140,100,70,.25)'; ctx.lineWidth=1.5;
  for (let x=-20;x<W+40;x+=46){
    ctx.beginPath(); ctx.moveTo(x, H); ctx.lineTo(x+14, floorY); ctx.stroke();
  }
  ctx.strokeStyle='rgba(120,85,60,.35)';
  ctx.beginPath(); ctx.moveTo(0, floorY+1); ctx.lineTo(W, floorY+1); ctx.stroke();
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ============================================================
   애니메이터
   ============================================================ */
function makeAnimator(canvas, stepKey, opts){
  opts = opts || {};
  const ctx2 = canvas.getContext('2d');
  const st = { step: STEPS[stepKey], phase:0, speed:1, playing:true, sparkles:[], lastTs:0,
    maxS: opts.maxS || null, floorPad: opts.floorPad != null ? opts.floorPad : 14 };
  function fit(){
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width*dpr); canvas.height = Math.round(r.height*dpr);
    st.W = r.width; st.H = r.height;
  }
  fit(); st.fit = fit;
  window.addEventListener('resize', fit);

  st.setStep = (key, reset) => { st.step = STEPS[key]; if (reset){ st.phase=0; } };
  st.freeze = (tNorm) => { st.frozen = tNorm; };
  st.unfreeze = () => { st.frozen = null; };
  st.loop = (ts) => {
    const dt = Math.min(0.05, (ts - (st.lastTs||ts))/1000); st.lastTs = ts;
    if (st.playing && st.frozen == null) st.phase += dt * st.speed;
    const dur = st.step.dur;
    const t = st.frozen != null ? st.frozen : ((st.phase % dur) + dur) % dur / dur;
    const pose = samplePose(st.step, t);
    let S = 1.06 * (pose.zoom || 1) * (st.H/300);
    if (st.maxS) S = Math.min(S, st.maxS);
    const floorY = st.H - st.floorPad;
    const c = ctx2, dpr = canvas.width / st.W;
    c.setTransform(dpr,0,0,dpr,0,0);
    c.clearRect(0,0,st.W,st.H);
    drawScene(c, st.W, st.H, floorY, S);
    // 그림자
    c.save();
    c.translate(st.W/2 + (pose.hipX||0)*S*0.3, floorY);
    c.scale(pose.sx,1);
    c.fillStyle='rgba(160,110,90,.18)';
    c.beginPath(); c.ellipse(0, 6, 46*(1 - Math.min(0.4,(pose.hipY-85)/300)), 8, 0, 0, Math.PI*2); c.fill();
    c.restore();
    // 슈가
    c.save();
    c.translate(st.W/2 + (pose.hipX||0)*S, floorY);
    c.scale(S, -S);
    drawSugar(c, pose, {view: st.step.view});
    c.restore();
    // 스파클
    for (const s of st.sparkles){
      s.life -= dt; s.x += s.vx*dt; s.y += s.vy*dt; s.vy += 30*dt;
      c.save(); c.globalAlpha = Math.max(0, s.life);
      c.translate(s.x, s.y); c.rotate(s.life*3);
      c.fillStyle='#f7c4da'; star(c, 0,0, 6, 5.2); c.fill();
      c.restore();
    }
    st.sparkles = st.sparkles.filter(s=>s.life>0);
    requestAnimationFrame(st.loop);
  };
  requestAnimationFrame(st.loop);
  st.burst = () => {
    for (let i=0;i<14;i++){
      st.sparkles.push({ x: st.W/2 + (Math.random()-0.5)*120, y: st.H*0.45 + (Math.random()-0.5)*80,
        vx:(Math.random()-0.5)*90, vy:-40-Math.random()*70, life:0.7+Math.random()*0.5 });
    }
  };
  return st;
}
function star(c, x, y, R, r){
  c.beginPath();
  for (let i=0;i<8;i++){
    const a = i*Math.PI/4, rad = i%2? r:R;
    c[i?'lineTo':'moveTo'](x+Math.cos(a)*rad, y+Math.sin(a)*rad);
  }
  c.closePath();
}

/* ============================================================
   퀴즈 로직
   ============================================================ */
const $ = id => document.getElementById(id);
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]];} return a; };

const SHARE_URL = 'https://sheeny6-cmyk.github.io/magic-sugar-game/quiz/';

let anim = null, titleAnim = null;
let quiz = null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $(id).classList.add('on');
  window.scrollTo(0,0);
}

function startGame(){
  quiz = {
    qs: shuffle(QUESTIONS).slice(0,10),
    idx:0, score:0, streak:0, best:0,
    log: [], answered:false,
  };
  showScreen('s-quiz');
  if (!anim) anim = makeAnimator($('cv'), 'plie');
  loadQuestion();
}

function loadQuestion(){
  const q = quiz.qs[quiz.idx];
  quiz.answered = false;
  $('qNum').textContent = `Q${quiz.idx+1} / 10`;
  $('score').textContent = `${quiz.score}점`;
  const cb = $('combo');
  if (quiz.streak >= 2){ cb.textContent = `🔥 x${quiz.streak}`; cb.classList.add('on'); }
  else cb.classList.remove('on');
  $('progFill').style.width = `${(quiz.idx)/10*100}%`;
  $('feedback').classList.remove('on');
  $('hintText').classList.remove('on');
  $('btnHint').style.display='';
  $('btnHint').textContent='💡 어원 힌트 보기';
  $('beatTag').textContent = `♪ ${STEPS[q.key].beats} 시연 중`;

  // 보기: 정답 + 오답 3
  const others = shuffle(QUESTIONS.filter(x=>x.key!==q.key)).slice(0,3);
  quiz.choices = shuffle([q, ...others]);
  const box = $('choices'); box.innerHTML='';
  quiz.choices.forEach((cItem, i2) => {
    const b = document.createElement('button');
    b.className='choice';
    b.innerHTML = `<span class="ko">${cItem.ko}</span><span class="fr">${cItem.fr}</span>`;
    b.addEventListener('click', () => answer(i2));
    box.appendChild(b);
  });

  anim.setStep(q.key, true);
  anim.playing = true; $('btnPlay').textContent='⏸';
}

function answer(i2){
  if (quiz.answered) return;
  quiz.answered = true;
  const q = quiz.qs[quiz.idx];
  const correct = quiz.choices[i2].key === q.key;
  const btns = $('choices').querySelectorAll('.choice');
  btns.forEach((b, j) => {
    b.disabled = true;
    if (quiz.choices[j].key === q.key) b.classList.add('correct');
    else if (j === i2) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  let gained = 0;
  if (correct){
    quiz.streak++; quiz.best = Math.max(quiz.best, quiz.streak);
    gained = 100 + (quiz.streak-1)*20;
    quiz.score += gained;
    anim.burst();
  } else {
    quiz.streak = 0;
  }
  quiz.log.push({ q, ok: correct });
  $('score').textContent = `${quiz.score}점`;
  if (quiz.streak >= 2){ $('combo').textContent=`🔥 x${quiz.streak}`; $('combo').classList.add('on'); }
  else $('combo').classList.remove('on');

  const v = $('verdict');
  v.textContent = correct ? `정답! +${gained}점${quiz.streak>=2?` · 콤보 x${quiz.streak}`:''}` : '아쉬워요! 다음엔 꼭 맞혀요 🩰';
  v.className = 'verdict ' + (correct?'good':'bad');
  $('ansLine').textContent = `정답: ${q.ko} (${q.fr})`;
  $('expLine').textContent = q.exp;
  $('feedback').classList.add('on');
  $('btnNext').textContent = quiz.idx === 9 ? '결과 보기 🎀' : '다음 문제 →';
  $('progFill').style.width = `${(quiz.idx+1)/10*100}%`;
  $('feedback').scrollIntoView({behavior:'smooth', block:'nearest'});
}

function nextQuestion(){
  if (quiz.idx >= 9){ showResult(); return; }
  quiz.idx++;
  loadQuestion();
  window.scrollTo(0,0);
}

function gradeOf(score){ return GRADES.find(g=>score>=g.min); }

function showResult(){
  const g = gradeOf(quiz.score);
  const okN = quiz.log.filter(l=>l.ok).length;
  $('gradeEmoji').textContent = g.emoji;
  $('gradeName').textContent = g.name;
  $('finalScore').textContent = quiz.score;
  $('accText').textContent = `정답 ${okN}/10`;
  $('comboMaxText').textContent = `최고 콤보 x${quiz.best}`;
  // 등급 바
  const bar = $('gradeBar'); bar.innerHTML='';
  GRADES.slice().reverse().forEach(gg=>{
    const d = document.createElement('div');
    d.className = 'g-item' + (gg.name===g.name?' now':'');
    d.innerHTML = `<span>${gg.emoji} ${gg.name}</span><span>${gg.min}+</span>`;
    bar.appendChild(d);
  });
  // 복습 리스트
  const ul = $('reviewList'); ul.innerHTML='';
  quiz.log.forEach(l=>{
    const li = document.createElement('li');
    li.className = l.ok ? 'ok' : '';
    li.innerHTML = l.ok
      ? `<b>${l.q.ko}</b> (${l.q.fr}) ✓ 맞혔어요`
      : `<b>${l.q.ko}</b> (${l.q.fr}) — ${l.q.exp}`;
    ul.appendChild(li);
  });
  showScreen('s-result');
}

function shareText(){
  const g = gradeOf(quiz.score);
  const okN = quiz.log.filter(l=>l.ok).length;
  const wrong = quiz.log.filter(l=>!l.ok).map(l=>`${l.q.ko}(${l.q.fr})`);
  const lines = [
    '🩰 슈가의 발레 용어 퀴즈 결과 🩰',
    `점수 ${quiz.score}점 · 등급: ${g.emoji} ${g.name}`,
    `정답 ${okN}/10 · 최고 콤보 x${quiz.best}`,
  ];
  if (wrong.length) lines.push(`복습할 동작: ${wrong.join(', ')}`);
  lines.push('취발러라면 한번 풀어봐 ✨', SHARE_URL);
  return lines.join('\n');
}

async function copyResult(){
  const text = shareText();
  try {
    await navigator.clipboard.writeText(text);
  } catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  $('copyDone').classList.add('on');
  toast('결과를 복사했어요! 🎉');
}

let toastTimer=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'), 1800);
}

/* ---------- 이벤트 ---------- */
$('btnStart').addEventListener('click', startGame);
$('btnNext').addEventListener('click', nextQuestion);
$('btnRetry').addEventListener('click', startGame);
$('btnCopy').addEventListener('click', copyResult);
$('btnHint').addEventListener('click', () => {
  const q = quiz.qs[quiz.idx];
  $('hintText').textContent = `💡 ${q.hint}`;
  $('hintText').classList.add('on');
  $('btnHint').style.display='none';
});
$('btnPlay').addEventListener('click', () => {
  anim.playing = !anim.playing;
  $('btnPlay').textContent = anim.playing ? '⏸' : '▶';
});
$('btnSlow').addEventListener('click', () => {
  anim.speed = anim.speed === 1 ? 0.4 : 1;
  $('btnSlow').classList.toggle('slow-on', anim.speed !== 1);
  $('btnSlow').textContent = anim.speed === 1 ? '🐢 느리게' : '🐇 빠르게';
});

/* ---------- 타이틀 캐릭터 ---------- */
function bootTitle(){
  titleAnim = makeAnimator($('cv-title'), 'idle', { maxS: 1.45, floorPad: 30 });
}

/* ---------- 디버그 훅 (검증용) ---------- */
window.__quiz = {
  state: () => quiz ? ({ idx:quiz.idx, score:quiz.score, streak:quiz.streak, answered:quiz.answered,
    correct: quiz.qs[quiz.idx] ? quiz.qs[quiz.idx].key : null,
    choices: quiz.choices ? quiz.choices.map(c=>c.key) : [] }) : null,
  dbg: { samplePose, mergedFrames, lerpPose, P0, dirV },
  steps: () => Object.keys(STEPS),
  renderDemo: (key, t) => { // 스텝 프리뷰용: 해당 스텝을 지정 시점으로 고정 렌더
    const step = STEPS[key]; if (!step || !anim) return null;
    anim.setStep(key, true); anim.freeze(t);
    return samplePose(step, t);
  },
  demoCanvas: () => $('cv'),
};

bootTitle();
})();
</script>
